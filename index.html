function secureRandomInt(maxExclusive) {
  if (typeof crypto !== "undefined" && typeof crypto.getRandomValues === "function" && maxExclusive > 0) {
    const arr = new Uint32Array(1);
    const limit = Math.floor(0x100000000 / maxExclusive) * maxExclusive;
    while (true) {
      crypto.getRandomValues(arr);
      if (arr[0] < limit) return arr[0] % maxExclusive;
    }
  }
  return Math.floor(Math.random() * maxExclusive);
}

function secureRandomChars(length, alphabet = "abcdefghijklmnopqrstuvwxyz0123456789") {
  let out = "";
  for (let i = 0; i < length; i++) {
    out += alphabet[secureRandomInt(alphabet.length)];
  }
  return out;
}

function generateHostCode() {
  return String(1000 + secureRandomInt(9000));
}

function isValidId(id) {
  return typeof id === "string" && /^[a-zA-Z0-9_-]{1,64}$/.test(id);
}

function isValidRoomCode(code) {
  return typeof code === "string" && /^[A-HJ-NP-Z2-9]{4,8}$/.test(code);

function isValidMugshotDataUrl(dataUrl) {
  return typeof dataUrl === "string" && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]{1,120000}$/.test(dataUrl);
}

function isValidMp3Filename(filename) {
  return typeof filename === "string" && /^[a-zA-Z0-9_.-]+\.mp3$/.test(filename) && !filename.includes("..");
}

function isValidFirebaseUrl(rawUrl) {
  try {
    const u = new URL(String(rawUrl || "").trim());
    return u.protocol === "https:" && (u.hostname.endsWith(".firebaseio.com") || u.hostname.endsWith(".firebasedatabase.app"));
  } catch (e) {
    return false;
  }
}

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// Collision-free 2-digit PIN generator (CSPRNG-backed)
function generateUniquePin(playersMap) {
  const used = new Set(Object.values(playersMap || {}).map(p => String(p.pinCode || "")));
  for (let attempt = 0; attempt < 120; attempt++) {
    const candidate = String(11 + secureRandomInt(88));
    if (!used.has(candidate)) return candidate;
  }
  return String(10 + secureRandomInt(89));
}

let wakeLockSentinel = null;
async function requestScreenWakeLock() {
  if ("wakeLock" in navigator && !wakeLockSentinel) {
    try {
      wakeLockSentinel = await navigator.wakeLock.request("screen");
      wakeLockSentinel.addEventListener("release", () => {
        wakeLockSentinel = null;
      });
    } catch (e) {}
  }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && appState.viewMode !== "home") {
    requestScreenWakeLock();

});

const packCache = {};
function getEffectivePack(mysteryId, variantIdx = 0) {
  const safeId = MYSTERY_PACKS[mysteryId] ? mysteryId : "reunion_99";
  const normIdx = (typeof variantIdx === "number" && variantIdx >= 0) ? (variantIdx % 3) : 0;
  const cacheKey = `${safeId}__${normIdx}`;
  if (packCache[cacheKey]) return packCache[cacheKey];

  const raw = MYSTERY_PACKS[safeId];
  const pack = JSON.parse(JSON.stringify(raw));
  const vList = pack.variants || [];
  const v = vList[normIdx % Math.max(1, vList.length)];
  if (v) {
    pack.crimeSceneReport = v.crimeSceneReport;
    pack.forensicAutopsy = v.forensicAutopsy;
    pack.solutionText = v.solutionText;
    pack.midRoundTwist = v.midRoundTwist;
    pack.activeVariantLabel = `Ending Variant ${String.fromCharCode(65 + normIdx)}`;

    pack.characters.forEach(c => {
      if (c.role === "victim") return;
      if (c.id === v.killerId) {
        c.role = "killer";
        if (v.overrides && v.overrides[c.id]) {
          Object.assign(c, v.overrides[c.id]);
        }
      } else {
        c.role = "suspect";
      }
    });
  }
  packCache[cacheKey] = pack;
  return pack;
}

class SoundEngine {
  constructor() {
    this.ctx = null;
    this.isMuted = false;
    this.ambientEnabled = true;
    this.currentAmbientProfile = null;
    this.ambientGain = null;
    this.masterFilter = null;
    this.ambientNodes = [];
    this.ambientAudioEl = new Audio();
    this.ambientAudioEl.loop = true;
    this.usingMp3Ambient = false;
    this.sfxAudioEl = new Audio();
    this.noiseCache = {};
    this.forceCloudTTS = true;
    this.audioPlayer = new Audio();
    this.audioPlayer.referrerPolicy = "no-referrer";
    this.ttsQueue = [];
    this.isSpeakingCloud = false;
    this.ttsWatchdog = null;
    this.escalationPhase = "NORMAL"; // "NORMAL" | "TENSION" | "PANIC"
    this.pulseInterval = null;
    this.isSabotageMuffled = false;

  unlock() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === "suspended") {
      this.ctx.resume();
    }
    requestScreenWakeLock();
    const silentWav = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
    [this.audioPlayer, this.ambientAudioEl, this.sfxAudioEl].forEach(el => {
      if (el.paused) {
        el.src = silentWav;
        el.play().catch(() => {});
      }
    });
    this.playChime();
  }

  createNoiseBuffer(durationSec) {
    const key = String(durationSec);
    if (this.noiseCache[key]) return this.noiseCache[key];
    const bufferSize = Math.floor(this.ctx.sampleRate * durationSec);
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const output = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      output[i] = Math.random() * 2 - 1;
    }
    this.noiseCache[key] = buffer;
    return buffer;
  }

  startAmbient(profile = "space") {
    if (!this.ambientEnabled || this.isMuted) return;
    if (this.currentAmbientProfile === profile && (this.ambientNodes.length > 0 || this.usingMp3Ambient)) return;
    this.stopAmbient();
    this.currentAmbientProfile = profile;

    // Try ./audio/ambient_<profile>.mp3 first; fall back to Web Audio synth if missing

    this.ambientAudioEl.onerror = () => {

    };

      this.usingMp3Ambient = false;

  startSynthAmbient(profile = "space") {
    if (!this.ctx || !this.ambientEnabled || this.isMuted) return;
    const now = this.ctx.currentTime;
    this.masterFilter = this.ctx.createBiquadFilter();
    this.masterFilter.type = "lowpass";
    this.masterFilter.frequency.setValueAtTime(this.isSabotageMuffled ? 240 : 18000, now);

    this.ambientGain.gain.setValueAtTime(0.01, now);
    this.ambientGain.gain.linearRampToValueAtTime(0.14, now + 2.0);
    this.ambientGain.connect(this.masterFilter);
    this.masterFilter.connect(this.ctx.destination);

    if (profile === "woods" || profile === "manor" || profile === "haunted") {
      const noise = this.ctx.createBufferSource();
      noise.buffer = this.createNoiseBuffer(6.0);
      noise.loop = true;
      const filter = this.ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.setValueAtTime(profile === "manor" ? 420 : 650, now);
      filter.Q.setValueAtTime(0.7, now);
      noise.connect(filter);
      filter.connect(this.ambientGain);
      noise.start(now);
      this.ambientNodes.push(noise);
    } else if (profile === "yacht" || profile === "spa") {
      const noise = this.ctx.createBufferSource();
      noise.buffer = this.createNoiseBuffer(8.0);
      noise.loop = true;
      const filter = this.ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(280, now);
      noise.connect(filter);
      filter.connect(this.ambientGain);
      noise.start(now);
      this.ambientNodes.push(noise);
    } else {
      const baseFreq = profile === "space" ? 55.0 : 65.41;
      [baseFreq, baseFreq * 1.5].forEach(freq => {
        const osc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, now);
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(180, now);
        osc.connect(filter);
        filter.connect(this.ambientGain);
        osc.start(now);
        this.ambientNodes.push(osc);
      });
    }
  }

  stopAmbient() {
    if (this.usingMp3Ambient) {
      try { this.ambientAudioEl.pause(); } catch (e) {}
      this.usingMp3Ambient = false;
    }
    this.ambientNodes.forEach(n => {
      try { n.stop(); n.disconnect(); } catch (e) {}
    });
    this.ambientNodes = [];
    if (this.ambientGain) {
      try { this.ambientGain.disconnect(); } catch (e) {}

  chunkText(text, maxLen = 165) {

      .replace(/—/g, ", ")
      .replace(/€/g, " Euros ")
      .replace(/\s+/g, " ")
      .trim();
    const sentences = cleanText.replace(/([.!?])\s+/g, "$1|").split("|");
    const chunks = [];
    let current = "";
    sentences.forEach(s => {
      if ((current + " " + s).trim().length <= maxLen) {
        current = (current + " " + s).trim();
      } else {
        if (current) chunks.push(current);
        if (s.length <= maxLen) {

            } else {

    const nextChunk = this.ttsQueue.shift();
    const encoded = encodeURIComponent(nextChunk);

    this.ttsWatchdog = setTimeout(() => {
      this.playNextCloudChunk();
    }, 8500);

    this.audioPlayer.src = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=${encoded}`;
    this.audioPlayer.onended = () => this.playNextCloudChunk();
    this.audioPlayer.onerror = () => {
      this.fallbackNativeSpeech(nextChunk);
      this.playNextCloudChunk();
    };
    this.audioPlayer.play().catch(() => {
      this.fallbackNativeSpeech(nextChunk);
      this.playNextCloudChunk();
    });
  }

  fallbackNativeSpeech(text) {
    if (!("speechSynthesis" in window)) return;
    try {
      this.duckAmbient(true);
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = 0.94;
      utter.pitch = 0.85;
      utter.onend = () => this.duckAmbient(false);
      window.speechSynthesis.speak(utter);
    } catch (e) {
      this.duckAmbient(false);
    }
  }

  speakBulletin(text, mp3Filename = null) {
    if (this.isMuted || (!text && !mp3Filename)) return;
    if (mp3Filename && isValidMp3Filename(mp3Filename)) {
      if (this.ttsWatchdog) {
        clearTimeout(this.ttsWatchdog);
        this.ttsWatchdog = null;
      }
      this.ttsQueue = [];
      this.isSpeakingCloud = true;
      this.isPlayingMajorVO = true;
      this.duckAmbient(true);
      this.audioPlayer.src = `./audio/${mp3Filename}`;
      this.audioPlayer.onended = () => {
        this.isSpeakingCloud = false;
        this.isPlayingMajorVO = false;
        this.duckAmbient(false);
      };
      this.audioPlayer.onerror = () => {
        this.isSpeakingCloud = false;
        this.isPlayingMajorVO = false;
        this.speakBulletin(text, null);
      };
      this.audioPlayer.play().catch(() => {
        this.isSpeakingCloud = false;
        this.isPlayingMajorVO = false;
        this.speakBulletin(text, null);
      });
      return;
    }

    // Do not interrupt a major pre-recorded MP3 narration with minor clue TTS
    if (this.isPlayingMajorVO && !this.audioPlayer.paused) {
      return;
    }

    const nativeVoices = ("speechSynthesis" in window) ? window.speechSynthesis.getVoices() : [];
    const shouldUseCloud = this.forceCloudTTS || nativeVoices.length === 0;
    if (shouldUseCloud) {
      this.ttsQueue = this.chunkText(text);
      this.playNextCloudChunk();
    } else {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      this.fallbackNativeSpeech(text);
    }
  }
  // --- DYNAMIC AUDIO ESCALATION & BLACKOUT MUFFLE ---
  evaluateEscalation(remainingSeconds, isPaused, isBlackoutSabotage, round) {
    if (this.isMuted || !this.ambientEnabled || round < 1 || round > 3) {
      this.stopEscalationPulse();
      this.escalationPhase = "NORMAL";
      return;
    }

    if (isPaused) {
      this.stopEscalationPulse();
      if (this.usingMp3Ambient && this.ambientAudioEl && !this.ambientAudioEl.paused) {
        try { this.ambientAudioEl.pause(); } catch (e) {}
      }
      if (this.ctx && this.ambientGain) {
        this.ambientGain.gain.setTargetAtTime(0.001, this.ctx.currentTime, 0.2);
      }
      return;
    } else {
      if (this.usingMp3Ambient && this.ambientAudioEl && this.ambientAudioEl.paused) {
        this.ambientAudioEl.play().catch(() => {});
      }
      if (this.ctx && this.ambientGain && !this.isSpeakingCloud) {
        this.ambientGain.gain.setTargetAtTime(isBlackoutSabotage ? 0.04 : 0.14, this.ctx.currentTime, 0.3);
      }
    }

    this.isSabotageMuffled = Boolean(isBlackoutSabotage);
    if (this.ctx && this.masterFilter) {
      const targetCutoff = isBlackoutSabotage ? 220 : (remainingSeconds <= 60 ? 2800 : (remainingSeconds <= 180 ? 1800 : 18000));
      this.masterFilter.frequency.setTargetAtTime(targetCutoff, this.ctx.currentTime, 0.25);
    }
    if (this.usingMp3Ambient && this.ambientAudioEl && !this.isSpeakingCloud) {
      this.ambientAudioEl.volume = isBlackoutSabotage ? 0.05 : 0.22;
    }

    if (remainingSeconds <= 60 && remainingSeconds > 0) {
      if (this.escalationPhase !== "PANIC") {
        this.escalationPhase = "PANIC";
        if (this.usingMp3Ambient && this.ambientAudioEl) {
          try { this.ambientAudioEl.playbackRate = 1.08; } catch (e) {}
        }
        this.startEscalationPulse(620, 0.26, true);
      }
    } else if (remainingSeconds <= 180 && remainingSeconds > 60) {
      if (this.escalationPhase !== "TENSION") {
        this.escalationPhase = "TENSION";
        if (this.usingMp3Ambient && this.ambientAudioEl) {
          try { this.ambientAudioEl.playbackRate = 1.03; } catch (e) {}
        }
        this.startEscalationPulse(1150, 0.14, false);
      }
    } else if (this.escalationPhase !== "NORMAL") {
      this.escalationPhase = "NORMAL";
      if (this.usingMp3Ambient && this.ambientAudioEl) {
        try { this.ambientAudioEl.playbackRate = 1.0; } catch (e) {}
      }
      this.stopEscalationPulse();
    }
  }

  startEscalationPulse(intervalMs, maxGain, includeDoubleBeat = false) {
    this.stopEscalationPulse();
    this.pulseInterval = setInterval(() => {
      if (!this.ctx || this.isMuted || !this.ambientEnabled) return;
      if (this.ctx.state === "suspended") this.ctx.resume().catch(() => {});
      this.triggerSubBassBeat(0, maxGain);
      if (includeDoubleBeat) {
        this.triggerSubBassBeat(0.18, maxGain * 0.65);
      }
    }, intervalMs);
  }

  triggerSubBassBeat(delaySec, peakGain) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime + delaySec;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(58, now);
    osc.frequency.exponentialRampToValueAtTime(28, now + 0.16);
    g.gain.setValueAtTime(0.001, now);
    g.gain.linearRampToValueAtTime(peakGain, now + 0.025);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.19);
    osc.connect(g);
    g.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.21);
  }

  stopEscalationPulse() {
    if (this.pulseInterval) {
      clearInterval(this.pulseInterval);
      this.pulseInterval = null;
    }
  }
}

function processImageToNoirBase64(sourceEl, srcW, srcH) {
  const canvas = document.createElement("canvas");
  const size = 240;
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");

  const minDim = Math.min(srcW, srcH);
  const sx = (srcW - minDim) / 2;
  const sy = (srcH - minDim) / 2;
  ctx.drawImage(sourceEl, sx, sy, minDim, minDim, 0, 0, size, size);

  const imgData = ctx.getImageData(0, 0, size, size);
  const d = imgData.data;
  const totalPixels = d.length / 4;

  const lums = new Uint8Array(totalPixels);
  const hist = new Uint32Array(256);
  let sumLum = 0;

  for (let i = 0, p = 0; i < d.length; i += 4, p++) {
    const lum = Math.round(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]);
    lums[p] = lum;
    hist[lum]++;
    sumLum += lum;
  }

  const avgLum = sumLum / totalPixels;

  let lowCut = 0, highCut = 255;
  let acc = 0;
  const lowTarget = totalPixels * 0.02;
  const highTarget = totalPixels * 0.98;
  for (let v = 0; v < 256; v++) {
    acc += hist[v];
    if (acc <= lowTarget) lowCut = v;
    if (acc <= highTarget) highCut = v;
  }

  const dynamicRange = highCut - lowCut;
  if (avgLum < 8 || avgLum > 248 || dynamicRange < 6) {
    return null;
  }

  const gamma = avgLum < 60 ? 0.58 : (avgLum < 95 ? 0.74 : 0.92);
  const range = Math.max(25, dynamicRange);

  for (let i = 0, p = 0; i < d.length; i += 4, p++) {
    let norm = (lums[p] - lowCut) / range;
    norm = Math.min(1, Math.max(0, norm));
    let lifted = Math.pow(norm, gamma) * 255;
    let finalVal = Math.min(255, Math.max(0, (lifted - 128) * 1.15 + 128));
    d[i] = d[i + 1] = d[i + 2] = finalVal;
  }

  ctx.putImageData(imgData, 0, 0);
  return canvas.toDataURL("image/jpeg", 0.72);
}

async function captureNoirMugshot() {
  const video = document.getElementById("mugshotVideo");
  if (!video || video.readyState < 2 || !video.videoWidth) {
    return alert("Camera stream still warming up—wait 1 second or tap 'Upload' to pick a photo.");
  }

  const useFlash = document.getElementById("mugshotFlashToggle")?.checked;
  const modal = document.getElementById("mugshotModal");
  const card = document.getElementById("mugshotBoothCard");

  if (useFlash && modal && card) {

    await new Promise(r => setTimeout(r, 260));
  }

  const dataUrl = processImageToNoirBase64(video, video.videoWidth, video.videoHeight);

  if (useFlash && modal && card) {
    modal.classList.remove("!bg-white");
    card.classList.remove("!bg-white");
  }

  if (!dataUrl) {
    return alert("That photo was too dark or blank! Hold your phone closer to your face with Screen Flash checked and try again.");

  closeMugshotModal();
  savePlayerMugshot(dataUrl);
}

function handleMugshotFileUpload(ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const dataUrl = processImageToNoirBase64(img, img.width, img.height);
      if (!dataUrl) {
        return alert("Could not read that image—please try another photo.");
      }
      closeMugshotModal();
      savePlayerMugshot(dataUrl);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function cycleCorkboardStatus(charId) {
  const data = getCorkboardData();
  const cur = (data[charId] && data[charId].status) || "suspect";
  const order = ["suspect", "cleared", "prime"];
  const next = order[(order.indexOf(cur) + 1) % order.length];
  if (!data[charId]) data[charId] = { status: next, note: "" };
  else data[charId].status = next;
  try { localStorage.setItem(getCorkboardKey(), JSON.stringify(data)); } catch (e) {}

  const primeTargets = Object.keys(data).filter(k => data[k] && data[k].status === "prime");
  const s = appState.sessionData;
  if (s && s.players && s.players[appState.playerId]) {
    if (firebaseDb && appState.roomCode) {
      firebaseDb.ref(`mystery_rooms/${appState.roomCode}/players/${appState.playerId}/primeTargets`).set(primeTargets.length > 0 ? primeTargets : null);
      firebaseDb.ref(`mystery_rooms/${appState.roomCode}/updatedAt`).set(Date.now());
    } else {
      const copy = JSON.parse(JSON.stringify(s));
      copy.players[appState.playerId].primeTargets = primeTargets;
      writeRoomState(copy);
    }
  } else {
    renderApp();
  }
}

function computeHighSuspicionSuspectCount(s) {
  if (!s || !s.players) return 0;
  const counts = {};
  Object.values(s.players).forEach(p => {
    if (!p || !p.primeTargets) return;
    const targets = Array.isArray(p.primeTargets) ? p.primeTargets : Object.values(p.primeTargets);
    const uniqueTargets = new Set(targets.filter(Boolean));
    uniqueTargets.forEach(cid => {
      counts[cid] = (counts[cid] || 0) + 1;
    });
  });
  return Object.values(counts).filter(cnt => cnt >= 3).length;
}

    if (s && s.round >= 1 && s.round <= 3 && soundFX.ambientEnabled) {
      const pack = getEffectivePack(s.mysteryId, s.variantIndex);
      soundFX.startAmbient((pack && pack.ambientProfile) || "space");
    }
    soundFX.playChime();
    soundFX.speakBulletin("Host phone speaker mode enabled. Game audio and detective bulletins will play through this phone.");
  } else {
    if (appState.viewMode !== "tv") {
      soundFX.stopAmbient();
      soundFX.stopEscalation();
    }
  }
  renderApp();
}

const PACING_PRESETS = {
  quick:    { key: "quick",    label: "⚡ Quick (~25m)",    shortLabel: "⚡ Quick (~25m)",    act1Min: 8,  act2Min: 12, act3Min: 5,  twistAtSec: 360 },
  standard: { key: "standard", label: "🕵️ Standard (~45m)", shortLabel: "🕵️ Standard (~45m)", act1Min: 15, act2Min: 20, act3Min: 10, twistAtSec: 600 },
  extended: { key: "extended", label: "🍷 Extended (~60m)", shortLabel: "🍷 Extended (~60m)", act1Min: 20, act2Min: 30, act3Min: 10, twistAtSec: 900 }
};

function getPacingConfig(presetKey) {
  return PACING_PRESETS[presetKey] || PACING_PRESETS.standard;
}

function changePacingPreset(presetKey) {
  if (!appState.sessionData) return;
  if (!isAuthorizedHostOrTV(appState.sessionData)) {
    return alert("Only the Host or Smart TV can change game length.");
  }
  const validKey = PACING_PRESETS[presetKey] ? presetKey : "standard";
  if (firebaseDb && appState.roomCode) {
    firebaseDb.ref(`mystery_rooms/${appState.roomCode}`).update({
      pacingPreset: validKey,
      updatedAt: Date.now()
    });
  } else {
    const s = JSON.parse(JSON.stringify(appState.sessionData));
    s.pacingPreset = validKey;
    writeRoomState(s);
  }
}

function getAct1Missions(pack) {
  const victimChar = (pack && pack.characters && pack.characters[0]) ? pack.characters[0] : null;
  const victimShort = victimChar ? victimChar.name.split("(")[0].trim() : "the Guest of Honor";
  return [
    `🥂 Greet or clink glasses with the Guest of Honor (${victimShort})`,
    `🕵️ Ask 2 other suspects where they were right before the party started`,
    `🎭 Introduce yourself in-character & show off your costume or prop vibe`
  ];
}

function toggleAct1Mission(missionIdx) {
  const s = appState.sessionData;
  if (!s || s.round !== 1 || !s.players || !s.players[appState.playerId]) return;
  const me = s.players[appState.playerId];
  const currentMissions = Object.assign({}, me.act1Missions || {});
  currentMissions[missionIdx] = !currentMissions[missionIdx];

  const allThreeDone = Boolean(currentMissions[0] && currentMissions[1] && currentMissions[2]);
  const awardBonusNow = allThreeDone && !me.act1BonusClaimed;
  const nextTokens = awardBonusNow ? ((me.patDownTokens ?? 1) + 1) : (me.patDownTokens ?? 1);
  const nextClaimed = Boolean(me.act1BonusClaimed || awardBonusNow);

  if (awardBonusNow) {
    HapticsEngine.trigger("PATDOWN_UNLOCKED");
  } else {
    HapticsEngine.trigger("VOTE_LOCKED");
  }

  if (firebaseDb && appState.roomCode) {
    firebaseDb.ref(`mystery_rooms/${appState.roomCode}`).update({
      [`players/${appState.playerId}/act1Missions`]: currentMissions,
      [`players/${appState.playerId}/act1BonusClaimed`]: nextClaimed,
      [`players/${appState.playerId}/patDownTokens`]: nextTokens,
      updatedAt: Date.now()
    });
  } else {
    const copy = JSON.parse(JSON.stringify(s));
    copy.players[appState.playerId].act1Missions = currentMissions;
    copy.players[appState.playerId].act1BonusClaimed = nextClaimed;
    copy.players[appState.playerId].patDownTokens = nextTokens;
    writeRoomState(copy);
  }
}

function isHotSeatActive(session) {
  if (!session || !session.hotSeat || !session.hotSeat.charId) return false;
  if (session.isPaused) return (session.pausedHotSeatRemMs || 0) > 0;
  return Boolean(session.hotSeat.endsAt && Date.now() < session.hotSeat.endsAt);
}

function getHotSeatRemainingSec(session) {
  if (!session || !session.hotSeat || !session.hotSeat.charId) return 0;
  if (session.isPaused) return Math.max(0, Math.ceil((session.pausedHotSeatRemMs || 0) / 1000));
  if (!session.hotSeat.endsAt) return 0;
  return Math.max(0, Math.ceil((session.hotSeat.endsAt - Date.now()) / 1000));
}

function triggerHotSeat(charId) {
  const s = appState.sessionData;
  if (!s || s.round !== 2) return;
  if (!isAuthorizedGhostOrHost(s)) {
    return alert("Only the Ghost Investigator or Host/TV can call a Hot Seat spotlight.");
  }
  if (s.isPaused) {
    HapticsEngine.trigger("ERROR");
    return alert("Game is paused for Intermission!");
  }
  const pack = getEffectivePack(s.mysteryId, s.variantIndex);
  const charObj = pack.characters.find(c => c.id === charId);
  if (!charObj) return;

  const shortName = charObj.name.split("(")[0].trim();
  const now = Date.now();
  const hotSeatObj = {
    charId: charObj.id,
    endsAt: now + 60 * 1000,
    startedAt: now
  };
  const evObj = {
    id: "ev_hotseat_" + now,
    type: "clue",
    text: `🔦 60s HOT SEAT SPOTLIGHT: The Ghost Investigator has put ${shortName} in the Hot Seat!`,
    speechText: `Hot Seat interrogation! The Ghost Investigator has placed ${shortName} under the sixty second spotlight. Question their alibi now!`
  };

  if (firebaseDb && appState.roomCode) {
    firebaseDb.ref(`mystery_rooms/${appState.roomCode}`).update({
      hotSeat: hotSeatObj,
      pausedHotSeatRemMs: null,
      latestEvent: evObj,
      updatedAt: now
    });
  } else {
    const copy = JSON.parse(JSON.stringify(s));
    copy.hotSeat = hotSeatObj;
    copy.pausedHotSeatRemMs = null;
    copy.latestEvent = evObj;
    writeRoomState(copy);
  }
}

function clearHotSeat() {
  const s = appState.sessionData;
  if (!s) return;
  if (!isAuthorizedGhostOrHost(s)) {
    return alert("Only the Ghost Investigator or Host/TV can end the Hot Seat.");
  }
  const now = Date.now();
  if (firebaseDb && appState.roomCode) {
    firebaseDb.ref(`mystery_rooms/${appState.roomCode}`).update({
      hotSeat: null,
      pausedHotSeatRemMs: null,
      updatedAt: now
    });
  } else {
    const copy = JSON.parse(JSON.stringify(s));
    copy.hotSeat = null;
    copy.pausedHotSeatRemMs = null;
    writeRoomState(copy);
  }
}

function setPreferredVariant(val) {
  appState.preferredVariant = val;
}

function getCluesList(session) {
  if (!session || !session.publicClues) return [];
  if (Array.isArray(session.publicClues)) return session.publicClues.filter(Boolean);
  return Object.values(session.publicClues).filter(Boolean).sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
}

function getPlayerUnlockedList(playerObj) {
  if (!playerObj || !playerObj.unlockedPrivateClues) return [];
  if (Array.isArray(playerObj.unlockedPrivateClues)) return playerObj.unlockedPrivateClues.filter(Boolean);
  return Object.values(playerObj.unlockedPrivateClues).filter(Boolean);
}

function getPlayerDecoysList(playerObj) {
  if (!playerObj || !playerObj.plantedDecoys) return [];
  if (Array.isArray(playerObj.plantedDecoys)) return playerObj.plantedDecoys.filter(Boolean);
  return Object.values(playerObj.plantedDecoys).filter(Boolean).sort((a, b) => (b.receivedAt || 0) - (a.receivedAt || 0));
}

function isSabotageBlackoutActive(session) {
  if (!session) return false;
  if (session.isPaused) return (session.pausedSabotageBlackoutRemMs || 0) > 0;
  return Boolean(session.sabotageBlackoutUntil && Date.now() < session.sabotageBlackoutUntil);
}

function getSabotageBlackoutRemainingSec(session) {
  if (!session) return 0;
  if (session.isPaused) return Math.max(0, Math.ceil((session.pausedSabotageBlackoutRemMs || 0) / 1000));
  if (!session.sabotageBlackoutUntil) return 0;
  return Math.max(0, Math.ceil((session.sabotageBlackoutUntil - Date.now()) / 1000));
}

function getSabotageCooldownRemainingSec(session) {
  if (!session) return 0;
  if (session.isPaused) return Math.max(0, Math.ceil((session.pausedSabotageCooldownRemMs || 0) / 1000));
  if (!session.sabotageCooldownUntil) return 0;
  return Math.max(0, Math.ceil((session.sabotageCooldownUntil - Date.now()) / 1000));
}

function autoPurgeExpiredRooms() {
  const cutoff = Date.now() - ROOM_TTL_MS;
  try {
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (k && k.startsWith("mm_room_")) {
        const raw = localStorage.getItem(k);
        if (raw) {
          const parsed = JSON.parse(raw);
          const ts = parsed.updatedAt || parsed.createdAt || 0;
          if (ts > 0 && ts < cutoff) {
            localStorage.removeItem(k);
          }
        }
      }
    }
  } catch (e) {}
  // Note: Client-side root listing/deletion on /mystery_rooms is intentionally disabled
  // so strict Firebase RTDB Security Rules can block room enumeration & unauthorized deletes.
}

function syncPlayerIdToAuthUid(forceOverwrite = false) {
  if (firebaseAuth && firebaseAuth.currentUser && isValidId(firebaseAuth.currentUser.uid)) {
    const uid = firebaseAuth.currentUser.uid;
    appState.authUid = uid;
    if (forceOverwrite || !appState.sessionData) {
      appState.playerId = uid;
      try { localStorage.setItem("mm_player_id", uid); } catch (e) {}
    }
    return uid;
  }
  return null;
}

function ensureFirebaseAuth(configToUse) {
  if (!configToUse || !configToUse.apiKey || typeof firebase === "undefined" || typeof firebase.auth !== "function") {
    firebaseAuth = null;
    authReadyPromise = Promise.resolve(null);
    return authReadyPromise;
  }
  try {
    firebaseAuth = firebase.auth();
    if (!authReadyPromise) {
      authReadyPromise = new Promise((resolve) => {
        try {
          firebaseAuth.onIdTokenChanged((user) => {
            if (user && typeof user.getIdToken === "function") {
              user.getIdToken().then((t) => { appState.cachedAuthToken = t; }).catch(() => {});
            } else {
              appState.cachedAuthToken = null;
            }
          });
        } catch (e) {}
        const unsub = firebaseAuth.onAuthStateChanged((user) => {
          if (user && user.uid) {
            appState.authUid = user.uid;
            if (isValidId(user.uid) && !appState.sessionData) {
              appState.playerId = user.uid;
              try { localStorage.setItem("mm_player_id", user.uid); } catch (e) {}
            }
            unsub();
            resolve(user);
          }
        });
        if (syncPlayerIdToAuthUid(false)) {
          resolve(firebaseAuth.currentUser);
          return;
        }
        firebaseAuth.signInAnonymously().catch((err) => {
          console.warn("Firebase Anonymous Auth unavailable:", err && err.message ? err.message : err);
          resolve(null);
        });
      });
    }
    return authReadyPromise;
  } catch (err) {
    console.warn("Firebase Auth init warning:", err);
    firebaseAuth = null;
    authReadyPromise = Promise.resolve(null);
    return authReadyPromise;
  }
}

function initSyncBackend() {
  const forceLocal = localStorage.getItem("mm_force_local") === "true";
  const savedConfigRaw = localStorage.getItem("mm_firebase_config");
  let configToUse = null;

  if (!forceLocal) {
    if (savedConfigRaw) {
      try {
        const parsed = JSON.parse(savedConfigRaw);
        if (parsed && isValidFirebaseUrl(parsed.databaseURL)) {
          configToUse = parsed;
        }
      } catch (e) {
        if (isValidFirebaseUrl(savedConfigRaw)) {
          configToUse = { databaseURL: savedConfigRaw.trim() };
        }
      }
    } else if (DEFAULT_FIREBASE_CONFIG && isValidFirebaseUrl(DEFAULT_FIREBASE_CONFIG.databaseURL)) {
      configToUse = DEFAULT_FIREBASE_CONFIG;
    }
  }

  const dot = document.getElementById("syncDot");
  if (configToUse && window.firebase) {
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(configToUse);
      }
      firebaseDb = firebase.database();
      activeDatabaseUrl = configToUse.databaseURL;
      ensureFirebaseAuth(configToUse);
      dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400";
      dot.title = "Connected to Firebase Realtime DB (" + configToUse.databaseURL + ")";
      autoPurgeExpiredRooms();
      return;
    } catch (err) {
      console.warn("Firebase init fallback to local mode:", err);
    }
  }
  if (roomRef) {
    roomRef.off();
    roomRef = null;
  }
  if (secretHostRef) {
    secretHostRef.off();
    secretHostRef = null;
  }
  firebaseDb = null;
  firebaseAuth = null;
  authReadyPromise = Promise.resolve(null);
  dot.className = "w-2.5 h-2.5 rounded-full bg-amber-400";
  dot.title = "Local Same-Device Tab Sync Mode";
  autoPurgeExpiredRooms();
}

function saveLocalHostCode(roomCode, hostCode) {
  if (!isValidRoomCode(roomCode) || !/^\d{4}$/.test(String(hostCode || ""))) return;
  appState.localHostCodes[roomCode] = String(hostCode);
  try {
    localStorage.setItem("mm_host_codes", JSON.stringify(appState.localHostCodes));
  } catch (e) {}
}

function getVisibleHostCode(s) {
  if (!s || !s.roomCode) return null;
  if (appState.localHostCodes && /^\d{4}$/.test(String(appState.localHostCodes[s.roomCode] || ""))) {
    return String(appState.localHostCodes[s.roomCode]);
  }
  if (/^\d{4}$/.test(String(s._offlineHostCode || ""))) {
    return String(s._offlineHostCode);
  }
  return null;
}

function subscribeToHostSecret(code) {
  if (!firebaseDb || !isValidRoomCode(code)) return;
  if (secretHostRef) {
    try { secretHostRef.off(); } catch (e) {}
    secretHostRef = null;
  }
  secretHostRef = firebaseDb.ref(`room_host_secrets/${code}/hostCode`);
  try {
    secretHostRef.on("value", (snap) => {
      const val = snap && typeof snap.val === "function" ? snap.val() : null;
      if (typeof val === "string" && /^\d{4}$/.test(val)) {
        saveLocalHostCode(code, val);
        renderApp();
      }
    }, () => {});
  } catch (e) {}
}

function isAuthorizedHostOrTV(s) {
  if (!s) return false;
  if (appState.viewMode === "tv") {
    return !s.tvUid || s.tvUid === appState.playerId;
  }
  if (s.hostUid) return s.hostUid === appState.playerId;
  const me = s.players && s.players[appState.playerId];
  return Boolean(me && me.isHost);
}

function isAuthorizedKiller(s, packOpt) {
  if (!s || !s.players) return false;
  if (s.killerUid && s.killerUid === appState.playerId) return true;
  const me = s.players[appState.playerId];
  if (!me || !me.characterId) return false;
  const pack = packOpt || getEffectivePack(s.mysteryId, s.variantIndex);
  const myChar = pack && pack.characters ? pack.characters.find(c => c.id === me.characterId) : null;
  return Boolean(myChar && myChar.role === "killer");
}

function isAuthorizedGhostOrHost(s, packOpt) {
  if (!s) return false;
  if (isAuthorizedHostOrTV(s)) return true;
  if (s.ghostUid && s.ghostUid === appState.playerId) return true;
  const me = s.players && s.players[appState.playerId];
  if (!me || !me.characterId) return false;
  const pack = packOpt || getEffectivePack(s.mysteryId, s.variantIndex);
  const myChar = pack && pack.characters ? pack.characters.find(c => c.id === me.characterId) : null;
  return Boolean(myChar && myChar.role === "victim");
}

function sanitizeIncomingSession(rawSession) {
  if (!rawSession || typeof rawSession !== "object") return rawSession;
  if (rawSession.players && typeof rawSession.players === "object") {
    const cleanPlayers = {};
    Object.entries(rawSession.players).forEach(([pid, pObj]) => {
      if (!isValidId(pid) || !pObj || typeof pObj !== "object") return;
      const safePlayer = Object.assign({}, pObj);
      safePlayer.id = isValidId(safePlayer.id) ? safePlayer.id : pid;
      safePlayer.name = String(safePlayer.name || "Suspect").trim().slice(0, 32) || "Suspect";
      if (!isValidMugshotDataUrl(safePlayer.mugshot)) {
        safePlayer.mugshot = "";
      }
      cleanPlayers[pid] = safePlayer;
    });
    rawSession.players = cleanPlayers;
  }
  if (rawSession.latestEvent && rawSession.latestEvent.mp3File && !isValidMp3Filename(rawSession.latestEvent.mp3File)) {
    rawSession.latestEvent.mp3File = null;
  }
  return rawSession;
}

function subscribeToRoom(code, onFirstLoadCallback) {
  const upperCode = String(code || "").toUpperCase();
  if (!isValidRoomCode(upperCode)) {
    alert("Invalid room code format.");
    return;
  }
  appState.roomCode = upperCode;
  try {
    const url = new URL(window.location.href);
    url.searchParams.set("room", appState.roomCode);
    if (appState.viewMode === "tv") url.searchParams.set("tv", "1");
    else url.searchParams.delete("tv");
    window.history.replaceState({}, "", url.toString());
  } catch (e) {}

  let firstCallbackFired = false;

  if (firebaseDb) {
    if (roomRef) roomRef.off();
    roomRef = firebaseDb.ref(`mystery_rooms/${appState.roomCode}`);
    roomRef.on("value", (snap) => {
      const val = snap.val();
      if (val) {
        handleIncomingSessionUpdate(val);
      }
      if (!firstCallbackFired) {
        firstCallbackFired = true;
        if (onFirstLoadCallback) onFirstLoadCallback(val);
      }
    }, (err) => {
      console.warn("Firebase room subscription error:", err);
      if (!firstCallbackFired) {
        firstCallbackFired = true;
        resetToHome();
        alert("Could not connect to room (permission denied or network error). Please refresh and try again.");
      }
    });
    if (appState.viewMode === "tv") {
      subscribeToHostSecret(appState.roomCode);
    }
  } else {
    const raw = localStorage.getItem(`mm_room_${appState.roomCode}`);
    const parsed = raw ? JSON.parse(raw) : null;
    if (parsed) handleIncomingSessionUpdate(parsed);
    if (onFirstLoadCallback) onFirstLoadCallback(parsed);
  }
}

if (localChannel) {
  localChannel.onmessage = (ev) => {
    if (ev.data && ev.data.roomCode === appState.roomCode) {
      handleIncomingSessionUpdate(ev.data.session);
    }
  };
}
window.addEventListener("storage", (ev) => {
  if (ev.key === `mm_room_${appState.roomCode}` && ev.newValue) {
    handleIncomingSessionUpdate(JSON.parse(ev.newValue));
  }
});

function writeRoomState(sessionObj) {
  sessionObj.updatedAt = Date.now();
  if (!sessionObj.createdAt) sessionObj.createdAt = sessionObj.updatedAt;
  if (firebaseDb && appState.roomCode) {
    return firebaseDb.ref(`mystery_rooms/${appState.roomCode}`).set(sessionObj);
  } else if (appState.roomCode) {
    localStorage.setItem(`mm_room_${appState.roomCode}`, JSON.stringify(sessionObj));
    if (localChannel) {
      localChannel.postMessage({ roomCode: appState.roomCode, session: sessionObj });
    }
    handleIncomingSessionUpdate(sessionObj);
  }
  return Promise.resolve();
}

function handleIncomingSessionUpdate(newSession) {
  if (!newSession) return;
  newSession = sanitizeIncomingSession(newSession);
  if (!newSession.players) newSession.players = {};
  if (!newSession.publicClues) newSession.publicClues = {};
  if (!newSession.votes) newSession.votes = {};
  if (!newSession.awardVotes) newSession.awardVotes = {};
  if (typeof newSession.variantIndex !== "number") newSession.variantIndex = 0;
  if (!newSession.midTwistTriggered) midTwistLatch = false;
  if (newSession.round === 0) {
    try { localStorage.removeItem(getCorkboardKey()); } catch (e) {}
  }

  // Subscribe to host secret if we are authorized Host or TV and don't have the code cached yet
  if (firebaseDb && appState.roomCode && !getVisibleHostCode(newSession) && (appState.viewMode === "tv" || isAuthorizedHostOrTV(newSession))) {
    subscribeToHostSecret(appState.roomCode);
  }

  // If this player was active in the lobby (round 0) and was removed by the Host (not an intentional exit)
  if (!isExplicitExit && appState.viewMode === "player" && appState.playerId && appState.sessionData && appState.sessionData.round === 0) {
    const wasInLobby = Boolean(appState.sessionData.players && appState.sessionData.players[appState.playerId]);
    const isStillInLobby = Boolean(newSession.players && newSession.players[appState.playerId]);
    if (wasInLobby && !isStillInLobby) {
      resetToHome();
      alert("You were removed from the lobby by the Host.");
      return;
    }
  }

  // Disconnect lifecycle management without constant polling:
  // In Round 0 (Lobby), arm onDisconnect().remove()
  // In Round 1+ (Act I-IV), cancel onDisconnect so players who sleep/reload don't lose character roles!
  if (firebaseDb && appState.roomCode && appState.playerId) {
    try {
      const pRef = firebaseDb.ref(`mystery_rooms/${appState.roomCode}/players/${appState.playerId}`);
      if (newSession.round === 0) {
        if (newSession.players && newSession.players[appState.playerId]) {
          pRef.onDisconnect().remove();
        }
      } else {
        pRef.onDisconnect().cancel();
      }
    } catch (e) {}
  }

  // Self-healing Host check: if no connected player owns hostUid/isHost in lobby, promote first connected player
  if (newSession.round === 0 && newSession.players) {
    const pList = Object.values(newSession.players);
    const activeHostPresent = Boolean(
      (newSession.hostUid && newSession.players[newSession.hostUid]) ||
      pList.some(p => p && p.isHost)
    );
    if (pList.length > 0 && !activeHostPresent) {
      const firstPid = pList[0].id;
      if (appState.playerId === firstPid && firebaseDb && appState.roomCode) {
        firebaseDb.ref(`mystery_rooms/${appState.roomCode}`).update({
          hostUid: firstPid,
          [`players/${firstPid}/isHost`]: true
        }).catch(() => {});
      }
    }
  }

  appState.sessionData = newSession;
  const pack = getEffectivePack(newSession.mysteryId, newSession.variantIndex);

  if (isAudioOutputActive()) {
    if (newSession.round >= 1 && newSession.round <= 3 && soundFX.ambientEnabled) {
      soundFX.startAmbient(pack.ambientProfile || "space");
    } else if (newSession.round === 0 || newSession.round === 4) {
      soundFX.stopAmbient();
    }
  }

  if (Boolean(newSession.isPaused) !== appState.lastPauseState) {
    appState.lastPauseState = Boolean(newSession.isPaused);
    if (appState.viewMode === "player") {
      HapticsEngine.trigger("PAUSE_TOGGLE");
    }
  }

  const meObj = newSession.players && newSession.players[appState.playerId];
  const myDecoyCount = getPlayerDecoysList(meObj).length;
  if (myDecoyCount > appState.lastDecoyCount) {
    if (appState.lastDecoyCount >= 0 && appState.viewMode === "player" && newSession.round >= 1) {
      HapticsEngine.trigger("CLUE_RECEIVED");
    }
  }
  appState.lastDecoyCount = myDecoyCount;

  if (newSession.latestEvent && newSession.latestEvent.id !== appState.lastPlayedEventId) {
    appState.lastPlayedEventId = newSession.latestEvent.id;
    const ev = newSession.latestEvent;

    if (isAudioOutputActive()) {
      if (ev.type === "blackout" || ev.type === "sabotage_blackout") {
        soundFX.playBlackoutFX(pack ? pack.soundProfile : "siren");
        if (soundFX.pendingBulletinTimeout) clearTimeout(soundFX.pendingBulletinTimeout);
        soundFX.pendingBulletinTimeout = setTimeout(() => {
          soundFX.pendingBulletinTimeout = null;
          if (isAudioOutputActive()) {
            soundFX.speakBulletin(ev.speechText || ev.text, ev.mp3File);
          }
        }, 1600);
      } else if (ev.type === "clue" || ev.type === "phase" || ev.type === "twist") {
        soundFX.playChime();
        if (ev.speechText || ev.mp3File) soundFX.speakBulletin(ev.speechText || ev.text, ev.mp3File);
      } else if (ev.type === "reveal") {
        soundFX.playDrumrollAndReveal();
        if (ev.speechText || ev.mp3File) soundFX.speakBulletin(ev.speechText || ev.text, ev.mp3File);
      }
    }
    if (appState.viewMode === "player") {
      if (ev.type === "blackout" || ev.type === "sabotage_blackout") {
        HapticsEngine.trigger("SABOTAGE_BLACKOUT");
      } else if (ev.type === "twist") {
        HapticsEngine.trigger("TWIST_ALERT");
      } else if (ev.type === "clue" || ev.type === "phase" || ev.type === "reveal") {
        HapticsEngine.trigger("CLUE_RECEIVED");
      }
    }
  }

  renderApp();
}

/* ============================================================================
   5. GAME ROOM CREATION, ATOMIC UPDATES, PACING CONTROLS & AWARDS LOGIC
   ============================================================================ */
function generateRoomCode() {
  return secureRandomChars(6, ROOM_CODE_ALPHABET);
}

function createNewRoom(mysteryId, openAsMode) {
  if (firebaseAuth && !firebaseAuth.currentUser && authReadyPromise) {
    authReadyPromise.then(() => {
      if (firebaseAuth && firebaseAuth.currentUser) {
        createNewRoom(mysteryId, openAsMode);
      } else {
        alert("Unable to establish secure session. Please refresh and try again.");
      }
    });
    return;
  }

  syncPlayerIdToAuthUid(true);

  isExplicitExit = false;
  autoPurgeExpiredRooms();
  requestScreenWakeLock();
  const validMysteryId = MYSTERY_PACKS[mysteryId] ? mysteryId : "reunion_99";
  const code = generateRoomCode();
  const hostCode = generateHostCode();
  const pack = getEffectivePack(validMysteryId, 0);
  const now = Date.now();
  const initialSession = {
    roomCode: code,
    createdAt: now,
    updatedAt: now,
    tvUid: openAsMode === "tv" ? appState.playerId : null,
    hostUid: openAsMode === "player" ? appState.playerId : null,
    killerUid: null,
    ghostUid: null,
    mysteryId: validMysteryId,
    variantIndex: 0,
    pacingPreset: "standard",
    tvCompactMode: Boolean(appState.tvCompactMode),
    accompliceEnabled: false,
    accomplicePlayerId: null,
    midTwistTriggered: false,
    round: 0,
    phaseEndsAt: null,
    isPaused: false,
    pausedRemainingMs: null,
    hotSeat: null,
    players: {},
    publicClues: {},
    votes: {},
    awardVotes: {},
    latestEvent: {
      id: "ev_init_" + now,
      type: "init",
      text: `Lobby open for ${pack.title}. Scan QR or enter Room Code ${code} on your phones!`
    }
  };
  if (!firebaseAuth) {
    initialSession._offlineHostCode = hostCode;
  }
  saveLocalHostCode(code, hostCode);

  appState.viewMode = openAsMode;
  try {
    localStorage.setItem("mm_active_room", code);
    localStorage.setItem("mm_active_mode", openAsMode);
  } catch (e) {}
  updateModeBadge();
  subscribeToRoom(code, () => {
    const p = writeRoomState(initialSession);
    if (firebaseDb) {
      const writeSecret = () => {
        try {
          firebaseDb.ref(`room_host_secrets/${code}`).set({ hostCode, updatedAt: now }).catch(() => {});
        } catch (e) {}
      };
      if (p && typeof p.then === "function") p.then(writeSecret).catch(() => {});
      else writeSecret();
    }
    if (openAsMode === "player" && appState.playerName) {
      registerPlayerInSession(appState.playerId, appState.playerName);
    }
  });
}

function joinExistingRoom(code, playerName, asMode) {
  const cleanCode = (code || "").trim().toUpperCase();
  if (!isValidRoomCode(cleanCode)) {
    return alert("Please enter a valid 4–6 character Room Code.");
  }

  if (asMode === "player") {
    if (!playerName || !playerName.trim()) return alert("Please enter your name.");
    appState.playerName = playerName.trim().slice(0, 24);
    try { localStorage.setItem("mm_player_name", appState.playerName); } catch (e) {}
  }

  if (firebaseAuth && !firebaseAuth.currentUser && authReadyPromise) {
    authReadyPromise.then(() => {
      if (firebaseAuth && firebaseAuth.currentUser) {
        joinExistingRoom(cleanCode, playerName, asMode);
      } else {
        alert("Unable to establish secure session. Please refresh and try again.");
      }
    });
    return;
  }

  syncPlayerIdToAuthUid(true);

  isExplicitExit = false;
  requestScreenWakeLock();
  appState.viewMode = asMode;
  try {
    localStorage.setItem("mm_active_room", cleanCode);
    localStorage.setItem("mm_active_mode", asMode);
  } catch (e) {}
  updateModeBadge();

  subscribeToRoom(cleanCode, (existingVal) => {
    if (!existingVal) {
      resetToHome();
      alert(`Room "${cleanCode}" was not found or has expired. Check the TV screen and try again!`);
      return;
    }
    if (asMode === "tv") {
      if (!existingVal.tvUid) {
        if (firebaseDb) {
          firebaseDb.ref(`mystery_rooms/${cleanCode}/tvUid`).set(appState.playerId).catch(() => {});
        } else {
          const copy = JSON.parse(JSON.stringify(existingVal));
          copy.tvUid = appState.playerId;
          writeRoomState(copy);
        }
      }
      if (firebaseDb) {
        subscribeToHostSecret(cleanCode);
      }
    }
    if (asMode === "player") {
      registerPlayerInSession(appState.playerId, appState.playerName);
    }
  });
}

function registerPlayerInSession(pid, name) {
  const authedUid = syncPlayerIdToAuthUid(true);
  if (authedUid) pid = authedUid;
  if (!isValidId(pid)) return;
  const s = appState.sessionData;
  const playersMap = (s && s.players) ? s.players : {};
  const existingPlayer = playersMap[pid];

  if (!existingPlayer && Object.keys(playersMap).length >= 10) {
    alert("This room already has the maximum 10 players! Joining as a spectator.");
    return;
  }

  // Self-healing Host check: if no active host exists, assign hostUid & isHost to this player
  const activeHostExists = Boolean(
    (s && s.hostUid && playersMap[s.hostUid]) ||
    Object.values(playersMap).some(p => p && p.isHost)
  );
  const mugshotRaw = appState.playerMugshot || (existingPlayer && existingPlayer.mugshot) || "";
  const mugshotToUse = isValidMugshotDataUrl(mugshotRaw) ? mugshotRaw : "";
  const cleanName = String(name || "Suspect").trim().slice(0, 24) || "Suspect";
  const becomeHost = (existingPlayer && Boolean(existingPlayer.isHost)) || !activeHostExists;

  const playerObj = existingPlayer ? {
    ...existingPlayer,
    name: cleanName,
    mugshot: mugshotToUse,
    isHost: becomeHost
  } : {
    id: pid,
    name: cleanName,
    mugshot: mugshotToUse,
    isHost: becomeHost,
    characterId: null,
    sharedAlibi: false,
    isAccomplice: false,
    pinCode: generateUniquePin(playersMap),
    patDownTokens: 1,
    unlockedPrivateClues: {},
    joinedAt: Date.now()
  };

  if (firebaseDb && appState.roomCode) {
    const playerRef = firebaseDb.ref(`mystery_rooms/${appState.roomCode}/players/${pid}`);
    const pSet = playerRef.set(playerObj);
    const finishJoin = () => {
      if (!firebaseDb || !appState.roomCode) return;
      if (becomeHost) {
        firebaseDb.ref(`mystery_rooms/${appState.roomCode}/hostUid`).set(pid).catch(() => {});
        subscribeToHostSecret(appState.roomCode);
      }
      if (!s || s.round === 0) {
        try { playerRef.onDisconnect().remove(); } catch (e) {}
      }
      firebaseDb.ref(`mystery_rooms/${appState.roomCode}/updatedAt`).set(Date.now()).catch(() => {});
    };
    if (pSet && typeof pSet.then === "function") {
      pSet.then(finishJoin).catch((err) => {
        console.warn("Failed to register player in session:", err);
        alert("Could not join the lobby (session permission error). Please refresh the page and try again.");
      });
    } else {
      finishJoin();
    }
  } else if (s) {
    const copy = JSON.parse(JSON.stringify(s));
    if (!copy.players) copy.players = {};
    copy.players[pid] = playerObj;
    if (becomeHost) copy.hostUid = pid;
    writeRoomState(copy);
  }
}

function removePlayerFromLobby(roomCode, pid, sessionSnapshot) {
  if (!isValidRoomCode(roomCode) || !isValidId(pid)) return;
  const s = sessionSnapshot || appState.sessionData;
  if (pid !== appState.playerId && !isAuthorizedHostOrTV(s)) {
    return alert("Only the Host or TV can remove another player.");
  }
  const players = (s && s.players) ? s.players : {};
  const leavingPlayer = players[pid];
  const wasHost = Boolean((leavingPlayer && leavingPlayer.isHost) || (s && s.hostUid === pid));
  const remainingPlayers = Object.values(players).filter(p => p && p.id !== pid);

  if (firebaseDb) {
    if (wasHost) {
      const nextHostId = remainingPlayers.length > 0 ? remainingPlayers[0].id : null;
      try {
        firebaseDb.ref(`mystery_rooms/${roomCode}/hostUid`).set(nextHostId);
        if (nextHostId) {
          firebaseDb.ref(`mystery_rooms/${roomCode}/players/${nextHostId}/isHost`).set(true);
        }
      } catch (e) {}
    }
    const playerRef = firebaseDb.ref(`mystery_rooms/${roomCode}/players/${pid}`);
    try { playerRef.onDisconnect().cancel(); } catch (e) {}
    playerRef.remove();
    try {
      firebaseDb.ref(`mystery_rooms/${roomCode}/updatedAt`).set(Date.now());
    } catch (e) {}
  } else if (s && s.players) {
    const copy = JSON.parse(JSON.stringify(s));
    delete copy.players[pid];
    if (wasHost) {
      copy.hostUid = remainingPlayers.length > 0 ? remainingPlayers[0].id : null;
      if (remainingPlayers.length > 0 && copy.players[remainingPlayers[0].id]) {
        copy.players[remainingPlayers[0].id].isHost = true;
      }
    }
    writeRoomState(copy);
  }

  // Backup keepalive DELETE request: ensures immediate server-side deletion even if mobile tab is closing
  try {
    const dbUrl = activeDatabaseUrl || (DEFAULT_FIREBASE_CONFIG && DEFAULT_FIREBASE_CONFIG.databaseURL) || "";
    if (isValidFirebaseUrl(dbUrl) && typeof fetch === "function") {
      const authSuffix = appState.cachedAuthToken ? `?auth=${encodeURIComponent(appState.cachedAuthToken)}` : "";
      const restUrl = `${dbUrl.replace(/\/$/, "")}/mystery_rooms/${roomCode}/players/${pid}.json${authSuffix}`;
      fetch(restUrl, { method: "DELETE", keepalive: true }).catch(() => {});
    }
  } catch (e) {}
}

function kickPlayerFromLobby(pid) {
  if (!isValidId(pid)) return;
  const s = appState.sessionData;
  if (!s || s.round !== 0 || !s.players) return;
  if (!isAuthorizedHostOrTV(s)) {
    return alert("Only the Host or TV can remove players from the lobby.");
  }
  const target = s.players[pid];
  if (!target) return;
  if (confirm(`Remove ${target.name} from the lobby?`)) {
    removePlayerFromLobby(appState.roomCode, pid);
  }
}

function claimHostRole() {
  const s = appState.sessionData;
  if (!s || !s.players || !s.players[appState.playerId]) {
    return alert("Join a room as a player on your phone first to claim Host Controls.");
  }

  const me = s.players[appState.playerId];
  const currentHostUid = s.hostUid || (Object.values(s.players).find(p => p && p.isHost)?.id) || null;
  if (currentHostUid === appState.playerId && me.isHost) {
    return alert("You are already the Host of this room!");
  }

  const currentHostPresent = Boolean(currentHostUid && s.players[currentHostUid]);
  let enteredClaimCode = null;

  if (currentHostPresent) {
    const rawEntry = prompt(
      `Host Controls are currently held by ${s.players[currentHostUid].name}.\n\n` +
      `Enter the 4-digit Host Code shown on the Smart TV to take over Host Controls:`
    );
    if (rawEntry === null) return;
    enteredClaimCode = String(rawEntry).trim();
    if (!/^\d{4}$/.test(enteredClaimCode)) {
      return alert("Please enter the exact 4-digit numeric Host Code shown on the Smart TV.");
    }
    const localExpected = getVisibleHostCode(s);
    if (localExpected && enteredClaimCode !== localExpected) {
      return alert("Incorrect 4-digit Host Code. Check the Smart TV screen and try again.");
    }
  } else {
    if (!confirm("No active Host is in the room. Claim Host Controls on this phone?")) {
      return;
    }
  }

  const now = Date.now();
  const evObj = {
    id: "ev_host_" + now,
    type: "phase",
    text: `👑 HOST UPDATE: ${me.name} is now controlling Host functions.`
  };

  if (firebaseDb && appState.roomCode) {
    const updates = {
      hostUid: appState.playerId,
      latestEvent: evObj,
      updatedAt: now
    };
    if (enteredClaimCode) {
      updates.hostClaimCode = enteredClaimCode;
    }
    Object.keys(s.players).forEach(pid => {
      updates[`players/${pid}/isHost`] = (pid === appState.playerId);
    });
    firebaseDb.ref(`mystery_rooms/${appState.roomCode}`).update(updates).then(() => {
      // Clear temporary claim proof and rotate TV secret code so a one-time code cannot be reused
      const nextCode = generateHostCode();
      saveLocalHostCode(appState.roomCode, nextCode);
      try {
        firebaseDb.ref(`mystery_rooms/${appState.roomCode}/hostClaimCode`).set(null).catch(() => {});
        firebaseDb.ref(`room_host_secrets/${appState.roomCode}`).set({ hostCode: nextCode, updatedAt: Date.now() }).catch(() => {});
      } catch (e) {}
      subscribeToHostSecret(appState.roomCode);
    }).catch(() => {
      alert("Host claim rejected: incorrect 4-digit Host Code or insufficient permissions.");
    });
  } else {
    const copy = JSON.parse(JSON.stringify(s));
    copy.hostUid = appState.playerId;
    Object.keys(copy.players).forEach(pid => {
      copy.players[pid].isHost = (pid === appState.playerId);
    });
    copy.latestEvent = evObj;
    if (enteredClaimCode) {
      const rotated = generateHostCode();
      saveLocalHostCode(appState.roomCode, rotated);
      if (!firebaseAuth) copy._offlineHostCode = rotated;
    }
    writeRoomState(copy);
  }
}

function transferHostToPlayer(targetPid) {
  const s = appState.sessionData;
  if (!s || !s.players || !isValidId(targetPid)) return;
  if (!isAuthorizedHostOrTV(s)) {
    return alert("Only the current Host or Smart TV can transfer Host Controls.");
  }
  const target = s.players[targetPid];
  if (!target) return;
  if (s.hostUid === targetPid && target.isHost) {
    return alert(`${target.name} is already the Host.`);
  }
  if (!confirm(`Transfer Host Controls to ${target.name}?`)) return;

  const now = Date.now();
  const evObj = {
    id: "ev_host_" + now,
    type: "phase",
    text: `👑 HOST TRANSFERRED: ${target.name} is now the room Host.`
  };

  if (firebaseDb && appState.roomCode) {
    const updates = {
      hostUid: targetPid,
      latestEvent: evObj,
      updatedAt: now
    };
    Object.keys(s.players).forEach(pid => {
      updates[`players/${pid}/isHost`] = (pid === targetPid);
    });
    firebaseDb.ref(`mystery_rooms/${appState.roomCode}`).update(updates).catch(() => {
      alert("Host transfer failed — insufficient permissions.");
    });
  } else {
    const copy = JSON.parse(JSON.stringify(s));
    copy.hostUid = targetPid;
    Object.keys(copy.players).forEach(pid => {
      copy.players[pid].isHost = (pid === targetPid);
    });
    copy.latestEvent = evObj;
    writeRoomState(copy);
  }
}

function toggleTimerPause() {
  const s = appState.sessionData;
  if (!s || s.round < 1 || s.round > 3) return;
  if (!isAuthorizedHostOrTV(s)) {
    return alert("Only the Host or Smart TV can pause or resume the game.");
  }
  const now = Date.now();
  let updates = {};

  if (s.isPaused) {
    const rem = typeof s.pausedRemainingMs === "number" ? s.pausedRemainingMs : 5 * 60 * 1000;
    const sabCoolRem = typeof s.pausedSabotageCooldownRemMs === "number" ? s.pausedSabotageCooldownRemMs : 0;
    const sabBlkRem = typeof s.pausedSabotageBlackoutRemMs === "number" ? s.pausedSabotageBlackoutRemMs : 0;
    const hotRem = typeof s.pausedHotSeatRemMs === "number" ? s.pausedHotSeatRemMs : 0;
    const resumedHotSeat = (s.hotSeat && s.hotSeat.charId && hotRem > 0) ? {
      charId: s.hotSeat.charId,
      endsAt: now + hotRem,
      startedAt: s.hotSeat.startedAt || now
    } : null;
    updates = {
      isPaused: false,
      pausedRemainingMs: null,
      pausedSabotageCooldownRemMs: null,
      pausedSabotageBlackoutRemMs: null,
      pausedHotSeatRemMs: null,
      phaseEndsAt: now + rem,
      sabotageCooldownUntil: sabCoolRem > 0 ? (now + sabCoolRem) : null,
      sabotageBlackoutUntil: sabBlkRem > 0 ? (now + sabBlkRem) : null,
      hotSeat: resumedHotSeat,
      updatedAt: now
    };
  } else {
    const rem = Math.max(0, (s.phaseEndsAt || now) - now);
    const sabCoolRem = s.sabotageCooldownUntil ? Math.max(0, s.sabotageCooldownUntil - now) : 0;
    const sabBlkRem = s.sabotageBlackoutUntil ? Math.max(0, s.sabotageBlackoutUntil - now) : 0;
    const hotRem = (s.hotSeat && s.hotSeat.endsAt) ? Math.max(0, s.hotSeat.endsAt - now) : 0;
    updates = {
      isPaused: true,
      pausedRemainingMs: rem,
      pausedSabotageCooldownRemMs: sabCoolRem,
      pausedSabotageBlackoutRemMs: sabBlkRem,
      pausedHotSeatRemMs: hotRem,
      updatedAt: now
    };
  }

  if (firebaseDb && appState.roomCode) {
    firebaseDb.ref(`mystery_rooms/${appState.roomCode}`).update(updates);
  } else {
    const copy = JSON.parse(JSON.stringify(s));
    Object.assign(copy, updates);
    writeRoomState(copy);
  }
}

/* --- KILLER SABOTAGE COOLDOWN ACTIONS (BLACKOUT & PLANT RED HERRING) --- */
const SABOTAGE_COOLDOWN_MS = 90 * 1000; // 90 seconds
const SABOTAGE_BLACKOUT_DURATION_MS = 20 * 1000; // 20 seconds

function triggerKillerSabotage(actionType) {
  const s = appState.sessionData;
  if (!s || s.round < 1 || s.round > 3) return;
  if (!isAuthorizedKiller(s)) {
    return alert("Only the active Killer can trigger Covert Sabotage.");
  }
  if (s.isPaused) {
    HapticsEngine.trigger("ERROR");
    return alert("Game is currently in Intermission Pause! Wait until the Host resumes.");
  }

  const pack = getEffectivePack(s.mysteryId, s.variantIndex);
  const me = s.players && s.players[appState.playerId];
  const myChar = (me && me.characterId) ? pack.characters.find(c => c.id === me.characterId) : null;
  if (!myChar || myChar.role !== "killer") {
    HapticsEngine.trigger("ERROR");
    return;
  }

  const now = Date.now();
  if (s.sabotageCooldownUntil && now < s.sabotageCooldownUntil) {
    HapticsEngine.trigger("ERROR");
    return;
  }

  const nextCooldownUntil = now + SABOTAGE_COOLDOWN_MS;

  if (actionType === "BLACKOUT") {
    const blackoutUntil = now + SABOTAGE_BLACKOUT_DURATION_MS;
    const evObj = {
      id: "ev_sab_blk_" + now,
      type: "sabotage_blackout",
      text: "⚡ POWER SABOTAGED! Security terminals offline & 1-on-1 Pat-Downs locked for 20 seconds!",
      speechText: "Warning! Power grid sabotage detected. Security terminals and suspect pat-downs are locked for twenty seconds."
    };

    if (firebaseDb && appState.roomCode) {
      firebaseDb.ref(`mystery_rooms/${appState.roomCode}`).update({
        sabotageCooldownUntil: nextCooldownUntil,
        sabotageBlackoutUntil: blackoutUntil,
        latestEvent: evObj,
        updatedAt: now
      });
    } else {
      const copy = JSON.parse(JSON.stringify(s));
      copy.sabotageCooldownUntil = nextCooldownUntil;
      copy.sabotageBlackoutUntil = blackoutUntil;
      copy.latestEvent = evObj;
      writeRoomState(copy);
    }
    HapticsEngine.trigger("SABOTAGE_SENT");
  } else if (actionType === "PLANT_DECOY") {
    const otherPids = Object.keys(s.players || {}).filter(pid => {
      if (pid === appState.playerId) return false;
      const pChar = pack.characters.find(c => c.id === s.players[pid].characterId);
      return !pChar || pChar.role !== "victim";
    });
    const fallbackPids = Object.keys(s.players || {}).filter(pid => pid !== appState.playerId);
    const pool = otherPids.length > 0 ? otherPids : fallbackPids;

    if (pool.length === 0) {
      HapticsEngine.trigger("ERROR");
      return alert("No other suspects in the room to plant a decoy clue on!");
    }

    const targetPid = pool[Math.floor(Math.random() * pool.length)];
    const innocentChars = pack.characters.filter(c => c.role === "suspect");
    const framedChar = innocentChars.length > 0
      ? innocentChars[Math.floor(Math.random() * innocentChars.length)]
      : pack.characters[1];
    const framedShort = framedChar ? framedChar.name.split("(")[0].trim() : "an unknown guest";

    const decoyTemplates = [
      `Anonymous Corridor Tip: Someone matching ${framedShort}'s silhouette was spotted hurriedly wiping down evidence near the crime scene.`,
      `Intercepted Security Slip: Unverified witness claims ${framedShort} was seen tampering with the breaker latch five minutes before the alarm.`,
      `Overheard Whisper: A guest swore they saw ${framedShort} hiding a restricted item in their pocket right before the commotion.`
    ];
    const chosenDetail = decoyTemplates[Math.floor(Math.random() * decoyTemplates.length)];
    const decoyId = "decoy_" + now;
    const decoyObj = {
      id: decoyId,
      title: "🕵️ ANONYMOUS TIP-OFF SLIP",
      detail: chosenDetail,
      isDecoy: true,
      receivedAt: now
    };

    if (firebaseDb && appState.roomCode) {
      firebaseDb.ref(`mystery_rooms/${appState.roomCode}`).update({
        sabotageCooldownUntil: nextCooldownUntil,
        [`players/${targetPid}/plantedDecoys/${decoyId}`]: decoyObj,
        updatedAt: now
      });
    } else {
      const copy = JSON.parse(JSON.stringify(s));
      copy.sabotageCooldownUntil = nextCooldownUntil;
      if (!copy.players[targetPid].plantedDecoys) copy.players[targetPid].plantedDecoys = {};
      copy.players[targetPid].plantedDecoys[decoyId] = decoyObj;
      writeRoomState(copy);
    }
    HapticsEngine.trigger("SABOTAGE_SENT");
  }
}

function addFiveMinutesToTimer() {
  const s = appState.sessionData;
  if (!s || s.round < 1 || s.round > 3) return;
  if (!isAuthorizedHostOrTV(s)) {
    return alert("Only the Host or Smart TV can add time to the clock.");
  }
  const now = Date.now();
  const fiveMinMs = 5 * 60 * 1000;
  let updates = {};

  if (s.isPaused) {
    updates = {
      pausedRemainingMs: (s.pausedRemainingMs || 0) + fiveMinMs,
      updatedAt: now
    };
  } else {
    const baseEnd = Math.max(now, s.phaseEndsAt || now);
    updates = {
      phaseEndsAt: baseEnd + fiveMinMs,
      updatedAt: now
    };
  }

  if (firebaseDb && appState.roomCode) {
    firebaseDb.ref(`mystery_rooms/${appState.roomCode}`).update(updates);
  } else {
    const copy = JSON.parse(JSON.stringify(s));
    Object.assign(copy, updates);
    writeRoomState(copy);
  }
}

function toggleAccompliceOption(checked) {
  if (!appState.sessionData) return;
  if (!isAuthorizedHostOrTV(appState.sessionData)) {
    return alert("Only the Host or Smart TV can toggle Accomplice Mode.");
  }
  if (firebaseDb && appState.roomCode) {
    firebaseDb.ref(`mystery_rooms/${appState.roomCode}`).update({
      accompliceEnabled: Boolean(checked),
      updatedAt: Date.now()

function getLocalPlayedVariants() {
  try {
    const raw = localStorage.getItem("mm_played_variants");
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function pickNextVariantIndex(mysteryId, s) {
  if (appState.preferredVariant === "0" || appState.preferredVariant === "1" || appState.preferredVariant === "2") {
    return Number(appState.preferredVariant);
  }
  const localMap = getLocalPlayedVariants();
  const roomMap = (s && s.playedVariants) ? s.playedVariants : {};
  const playedSet = new Set([
    ...(Array.isArray(localMap[mysteryId]) ? localMap[mysteryId] : []),
    ...(Array.isArray(roomMap[mysteryId]) ? roomMap[mysteryId] : [])
  ]);
  let candidates = [0, 1, 2].filter(v => !playedSet.has(v));
  if (candidates.length === 0) {
    candidates = [0, 1, 2];
  }
  return candidates[Math.floor(Math.random() * candidates.length)];
}

function recordPlayedVariant(mysteryId, variantIdx, s) {
  const localMap = getLocalPlayedVariants();
  const prevLocal = Array.isArray(localMap[mysteryId]) ? localMap[mysteryId] : [];
  const nextLocal = prevLocal.includes(variantIdx) ? prevLocal : [...prevLocal, variantIdx];
  localMap[mysteryId] = nextLocal.length >= 3 ? [variantIdx] : nextLocal;
  try { localStorage.setItem("mm_played_variants", JSON.stringify(localMap)); } catch (e) {}

  const roomMap = (s && s.playedVariants && typeof s.playedVariants === "object") ? JSON.parse(JSON.stringify(s.playedVariants)) : {};
  const prevRoom = Array.isArray(roomMap[mysteryId]) ? roomMap[mysteryId] : [];
  const nextRoom = prevRoom.includes(variantIdx) ? prevRoom : [...prevRoom, variantIdx];
  roomMap[mysteryId] = nextRoom.length >= 3 ? [variantIdx] : nextRoom;
  return roomMap;
}

function assignCharactersAndStartAct1() {
  if (!appState.sessionData || appState.sessionData.round !== 0) return;
  if (!isAuthorizedHostOrTV(appState.sessionData)) {
    return alert("Only the Host or Smart TV can deal characters and start Act I.");
  }
  const s = JSON.parse(JSON.stringify(appState.sessionData));
  const playerIds = Object.keys(s.players || {}).slice(0, 10);

  if (playerIds.length < 4) {
    alert("Need at least 4 players in the lobby so all 3 dynamic killer suspects + victim are in the room (click '+ Fill to 6 Demo Players' to test solo)!");
    return;
  }

  const chosenVariant = pickNextVariantIndex(s.mysteryId, s);
  const updatedPlayedVariants = recordPlayedVariant(s.mysteryId, chosenVariant, s);
  s.variantIndex = chosenVariant;
  s.playedVariants = updatedPlayedVariants;
  s.midTwistTriggered = false;
  midTwistLatch = false;
  const pack = getEffectivePack(s.mysteryId, chosenVariant);

  const victimChar = pack.characters.find(c => c.role === "victim") || pack.characters[0];
  const killerChar = pack.characters.find(c => c.role === "killer") || pack.characters[1];
  const variantKillerIds = new Set((pack.variants || []).map(v => v.killerId));
  const prioritySuspects = pack.characters.filter(c => c.id !== victimChar.id && c.id !== killerChar.id && variantKillerIds.has(c.id));
  const otherSuspects = pack.characters.filter(c => c.id !== victimChar.id && c.id !== killerChar.id && !variantKillerIds.has(c.id));
  const remainingSuspects = [...prioritySuspects, ...otherSuspects];
  const pool = [victimChar, killerChar, ...remainingSuspects.slice(0, Math.max(0, playerIds.length - 2))];
  const shuffledChars = pool.sort(() => Math.random() - 0.5);

  const usedPins = new Set();
  const innocentPlayerIds = [];
  let assignedKillerUid = null;
  let assignedGhostUid = null;

  playerIds.forEach((pid, idx) => {
    let pin = String(11 + secureRandomInt(88));
    while (usedPins.has(pin)) {
      pin = String(11 + secureRandomInt(88));
    }
    usedPins.add(pin);

    const assignedChar = shuffledChars[idx];
    s.players[pid].characterId = assignedChar.id;
    s.players[pid].sharedAlibi = false;
    s.players[pid].isAccomplice = false;
    s.players[pid].pinCode = pin;
    s.players[pid].patDownTokens = 1;
    s.players[pid].act1Missions = {};
    s.players[pid].act1BonusClaimed = false;
    s.players[pid].primeTargets = [];
    s.players[pid].unlockedPrivateClues = {};
    s.players[pid].plantedDecoys = {};

    if (assignedChar.role === "killer" && !pid.startsWith("bot_")) {
      assignedKillerUid = pid;
    } else if (assignedChar.role === "victim" && !pid.startsWith("bot_")) {
      assignedGhostUid = pid;
    }

    if (assignedChar.role === "suspect") {
      innocentPlayerIds.push(pid);
    }
  });

  s.killerUid = assignedKillerUid;
  s.ghostUid = assignedGhostUid;
  s.accomplicePlayerId = null;
  if (s.accompliceEnabled && innocentPlayerIds.length > 0) {
    const accPid = innocentPlayerIds[secureRandomInt(innocentPlayerIds.length)];
    s.players[accPid].isAccomplice = true;
    s.accomplicePlayerId = accPid;
  }

  const now = Date.now();
  const pacingCfg = getPacingConfig(s.pacingPreset);
  s.round = 1;
  s.isPaused = false;
  s.pausedRemainingMs = null;
  s.sabotageCooldownUntil = null;
  s.sabotageBlackoutUntil = null;
  s.hotSeat = null;
  s.pausedHotSeatRemMs = null;
  s.phaseEndsAt = now + pacingCfg.act1Min * 60 * 1000;
  s.publicClues = {};
  s.votes = {};
  s.awardVotes = {};
  s.latestEvent = {
    id: "ev_act1_" + now,
    type: "phase",
    text: `ACT I BEGINS (${pack.activeVariantLabel} Loaded): Read your private dossier on your phone and mingle!`,
    mp3File: `vo_${s.mysteryId}_intro.mp3`,
    speechText: `Act One has begun. ${pack.settingIntro} Check your mobile dossiers and mingle with the suspects.`
  };

  if (firebaseDb && appState.roomCode) {
    const fbUpdates = {
      variantIndex: s.variantIndex,
      playedVariants: s.playedVariants,
      midTwistTriggered: false,
      killerUid: assignedKillerUid,
      ghostUid: assignedGhostUid,
      accomplicePlayerId: s.accomplicePlayerId,
      round: 1,
      isPaused: false,
      pausedRemainingMs: null,
      sabotageCooldownUntil: null,
      sabotageBlackoutUntil: null,
      hotSeat: null,
      pausedHotSeatRemMs: null,
      phaseEndsAt: s.phaseEndsAt,
      publicClues: {},
      votes: {},
      awardVotes: {},
      latestEvent: s.latestEvent,
      updatedAt: now
    };
    playerIds.forEach(pid => {
      fbUpdates[`players/${pid}/characterId`] = s.players[pid].characterId;
      fbUpdates[`players/${pid}/sharedAlibi`] = false;
      fbUpdates[`players/${pid}/isAccomplice`] = s.players[pid].isAccomplice;
      fbUpdates[`players/${pid}/pinCode`] = s.players[pid].pinCode;
      fbUpdates[`players/${pid}/patDownTokens`] = 1;
      fbUpdates[`players/${pid}/act1Missions`] = null;
      fbUpdates[`players/${pid}/act1BonusClaimed`] = false;
      fbUpdates[`players/${pid}/primeTargets`] = null;
      fbUpdates[`players/${pid}/unlockedPrivateClues`] = null;
      fbUpdates[`players/${pid}/plantedDecoys`] = null;
    });
    firebaseDb.ref(`mystery_rooms/${appState.roomCode}`).update(fbUpdates);
  } else {
    writeRoomState(s);
  }
}

function executePinPatDown() {
  const s = appState.sessionData;
  if (!s || !s.players) return;
  if (s.isPaused) {
    HapticsEngine.trigger("ERROR");
    return alert("Investigation is currently paused for a Drink / Bathroom Intermission!");
  }
  if (isSabotageBlackoutActive(s)) {
    HapticsEngine.trigger("ERROR");
    return alert("⚡ POWER SABOTAGED! 1-on-1 Pat-Down terminals are locked out until emergency power comes back online!");
  }
  const me = s.players[appState.playerId];
  if (!me) return;
  if ((me.patDownTokens || 0) <= 0) {
    return alert("You have already used your 1-on-1 Pat-Down Token for this mystery!");
  }

  const inputEl = document.getElementById("patDownPinInput");
  const enteredPin = (inputEl ? inputEl.value : "").trim();
  if (!enteredPin) return alert("Enter another suspect's 2-digit Pat-Down PIN.");

  const targetPlayer = Object.values(s.players).find(p => String(p.pinCode) === enteredPin && p.id !== appState.playerId);
  if (!targetPlayer) {
    return alert("Invalid PIN (or that's your own PIN)! Ask a suspect in the room for their 2-digit Pat-Down PIN.");
  }

  const pack = getEffectivePack(s.mysteryId, s.variantIndex);
  const targetChar = pack.characters.find(c => c.id === targetPlayer.characterId);
  if (!targetChar || targetChar.role === "victim") {
    return alert("You cannot pat down the Victim / Ghost Investigator!");
  }

  const currentUnlocked = getPlayerUnlockedList(me);
  if (currentUnlocked.includes(targetChar.id)) {
    return alert("You already patted down this suspect!");
  }

  if (inputEl) inputEl.value = "";
  HapticsEngine.trigger("PATDOWN_UNLOCKED");
  const newTokens = Math.max(0, (me.patDownTokens ?? 1) - 1);
  if (firebaseDb && appState.roomCode) {
    firebaseDb.ref(`mystery_rooms/${appState.roomCode}`).update({
      [`players/${appState.playerId}/patDownTokens`]: newTokens,
      [`players/${appState.playerId}/unlockedPrivateClues/${targetChar.id}`]: targetChar.id,
      updatedAt: Date.now()
    });
  } else {
    const copy = JSON.parse(JSON.stringify(s));
    copy.players[appState.playerId].patDownTokens = newTokens;
    if (!copy.players[appState.playerId].unlockedPrivateClues) {
      copy.players[appState.playerId].unlockedPrivateClues = {};
    }
    copy.players[appState.playerId].unlockedPrivateClues[targetChar.id] = targetChar.id;
    writeRoomState(copy);
  }
}

function submitPlayerVote(voterId, suspectCharId) {
  const s = appState.sessionData;
  if (!s || s.round !== 3 || !s.players) return;
  if (voterId !== appState.playerId || !isValidId(voterId) || !s.players[voterId]) {
    return alert("You may only cast or change your own vote.");
  }
  if (s.isPaused) {
    HapticsEngine.trigger("ERROR");
    return alert("Game is paused for Intermission!");
  }
  const pack = getEffectivePack(s.mysteryId, s.variantIndex);
  const validSuspect = pack && pack.characters && pack.characters.some(c => c.id === suspectCharId && c.role !== "victim");
  if (!validSuspect) return;
  const myChar = pack.characters.find(c => c.id === s.players[voterId].characterId);
  if (myChar && myChar.role === "victim") {
    return alert("The Ghost Investigator does not cast an accusation vote.");
  }

  const currentVote = s.votes?.[voterId] || null;
  const nextVote = (currentVote === suspectCharId) ? null : suspectCharId;

  HapticsEngine.trigger("VOTE_LOCKED");
  if (firebaseDb && appState.roomCode) {
    firebaseDb.ref(`mystery_rooms/${appState.roomCode}/votes/${voterId}`).set(nextVote);
    firebaseDb.ref(`mystery_rooms/${appState.roomCode}/updatedAt`).set(Date.now());
  } else {
    const copy = JSON.parse(JSON.stringify(s));
    if (!copy.votes) copy.votes = {};
    if (nextVote === null) delete copy.votes[voterId];
    else copy.votes[voterId] = nextVote;
    writeRoomState(copy);
  }
}

function submitAwardVote(voterId, category, targetPlayerId) {
  const s = appState.sessionData;
  if (!s || s.round !== 3 || !s.players) return;
  if (voterId !== appState.playerId || !isValidId(voterId) || !s.players[voterId]) {
    return alert("You may only cast or change your own award vote.");
  }
  if (category !== "roleplayer" && category !== "pokerface") return;
  if (!isValidId(targetPlayerId) || !s.players[targetPlayerId]) return;
  if (s.isPaused) {
    HapticsEngine.trigger("ERROR");
    return alert("Game is paused for Intermission!");
  }
  const currentTarget = s.awardVotes?.[category]?.[voterId] || null;
  const nextTarget = (currentTarget === targetPlayerId) ? null : targetPlayerId;

  HapticsEngine.trigger("VOTE_LOCKED");
  if (firebaseDb && appState.roomCode) {
    firebaseDb.ref(`mystery_rooms/${appState.roomCode}/awardVotes/${category}/${voterId}`).set(nextTarget);
    firebaseDb.ref(`mystery_rooms/${appState.roomCode}/updatedAt`).set(Date.now());
  } else {
    const copy = JSON.parse(JSON.stringify(s));
    if (!copy.awardVotes) copy.awardVotes = {};
    if (!copy.awardVotes[category]) copy.awardVotes[category] = {};
    if (nextTarget === null) delete copy.awardVotes[category][voterId];
    else copy.awardVotes[category][voterId] = nextTarget;
    writeRoomState(copy);
  }
}

function tallyCategoryWinners(votesMap, playersMap) {
  if (!votesMap || !playersMap) return [];
  const counts = {};
  let maxCount = 0;
  Object.values(votesMap).forEach(targetPid => {
    if (!targetPid || !playersMap[targetPid]) return;
    counts[targetPid] = (counts[targetPid] || 0) + 1;
    if (counts[targetPid] > maxCount) maxCount = counts[targetPid];
  });
  if (maxCount === 0) return [];
  return Object.entries(counts)
    .filter(([, cnt]) => cnt === maxCount)
    .map(([pid]) => playersMap[pid].name);
}

function computeAwardWinners(s, pack) {
  const killerChar = pack.characters.find(c => c.role === "killer");
  const sleuthNames = [];
  if (killerChar && s.votes) {
    Object.entries(s.votes).forEach(([voterId, votedCharId]) => {
      if (votedCharId === killerChar.id && s.players && s.players[voterId]) {
        sleuthNames.push(s.players[voterId].name);
      }
    });
  }
  const bestRoleplayers = tallyCategoryWinners(s.awardVotes && s.awardVotes.roleplayer, s.players);
  const bestPokerFaces = tallyCategoryWinners(s.awardVotes && s.awardVotes.pokerface, s.players);
  return {
    sleuths: sleuthNames,
    roleplayers: bestRoleplayers,
    pokerfaces: bestPokerFaces
  };
}
