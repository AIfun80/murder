/* ============================================================================
   6. LIVE COUNTDOWN TIMER (WITH PAUSE SUPPORT) + TIMED MID-ACT TWIST
   ============================================================================ */
let warningPlayedForPhase = null;
let threeMinWarningPlayedForPhase = null;
let wasSabotageBlackoutActive = false;
let wasSabotageOnCooldown = false;
let wasHotSeatActive = false;

setInterval(() => {
  const badge = document.getElementById("timerBadge");
  const tvTimer = document.getElementById("tvTimerDisplay");
  const s = appState.sessionData;

  if (appState.viewMode === "home" || !s || (!s.phaseEndsAt && !s.isPaused) || s.round === 0 || s.round === 4) {
    if (badge) badge.classList.add("hidden");
    if (tvTimer) tvTimer.textContent = "--:--";
    if (isAudioOutputActive()) {
      soundFX.evaluateEscalation(999, false, false, 0);
    }
    return;
  }

  const remainingMs = s.isPaused
    ? Math.max(0, s.pausedRemainingMs || 0)
    : Math.max(0, (s.phaseEndsAt || Date.now()) - Date.now());

  const diffSec = Math.floor(remainingMs / 1000);
  const mins = String(Math.floor(diffSec / 60)).padStart(2, "0");
  const secs = String(diffSec % 60).padStart(2, "0");
  const formatted = s.isPaused ? `PAUSED (${mins}:${secs})` : `${mins}:${secs}`;

  if (badge) {
    if (appState.viewMode === "player") {
      badge.textContent = `⏱ ${formatted}`;
      badge.classList.remove("hidden");
    } else {
      badge.classList.add("hidden");
    }
  }
  if (tvTimer) {
    tvTimer.textContent = s.isPaused ? `⏸ ${mins}:${secs}` : `${mins}:${secs}`;
  }

  const blkActive = isSabotageBlackoutActive(s);
  const blkRemSec = getSabotageBlackoutRemainingSec(s);
  const coolRemSec = getSabotageCooldownRemainingSec(s);
  const hotActive = isHotSeatActive(s);
  const hotRemSec = getHotSeatRemainingSec(s);

  const blkCountdownEl = document.getElementById("sabotageBlackoutCountdown");
  if (blkCountdownEl) blkCountdownEl.textContent = `${blkRemSec}s`;

  const hotCountdownEl = document.getElementById("hotSeatCountdown");
  if (hotCountdownEl) hotCountdownEl.textContent = `${hotRemSec}s`;
  const hotMobileCountdownEl = document.getElementById("hotSeatMobileCountdown");
  if (hotMobileCountdownEl) hotMobileCountdownEl.textContent = `${hotRemSec}s`;

  const coolBadgeEl = document.getElementById("killerSabotageCooldownBadge");
  if (coolBadgeEl) {
    if (s.isPaused) {
      coolBadgeEl.textContent = "⏸ PAUSED";
      coolBadgeEl.className = "text-[10px] font-mono-code px-2 py-0.5 rounded bg-amber-950 text-amber-300 border border-amber-700";
    } else if (coolRemSec > 0) {
      coolBadgeEl.textContent = `⏳ COOLDOWN: ${coolRemSec}s`;
      coolBadgeEl.className = "text-[10px] font-mono-code px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700";
    } else {
      coolBadgeEl.textContent = "⚡ READY";
      coolBadgeEl.className = "text-[10px] font-mono-code px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-700 font-bold";
    }
  }

  if (wasSabotageBlackoutActive && !blkActive) {
    wasSabotageBlackoutActive = false;
    renderApp();
  } else {
    wasSabotageBlackoutActive = blkActive;
  }

  if (wasHotSeatActive && !hotActive) {
    wasHotSeatActive = false;
    renderApp();
  } else {
    wasHotSeatActive = hotActive;
  }

  if (wasSabotageOnCooldown && coolRemSec === 0 && !s.isPaused) {
    wasSabotageOnCooldown = false;
    HapticsEngine.trigger("READY");
    renderApp();
  } else if (coolRemSec > 0) {
    wasSabotageOnCooldown = true;
  }

  if (isAudioOutputActive()) {
    soundFX.evaluateEscalation(diffSec, Boolean(s.isPaused), blkActive, s.round);
  }

  if (!s.isPaused) {
    const pacingCfg = getPacingConfig(s.pacingPreset);
    if (s.round === 2 && !s.midTwistTriggered && !midTwistLatch && diffSec <= pacingCfg.twistAtSec && diffSec > 0) {
      const me = s.players && s.players[appState.playerId];
      if (appState.viewMode === "tv" || (me && me.isHost)) {
        triggerMidRoundTwist();
      }
    }

    if (isAudioOutputActive() && diffSec === 180 && threeMinWarningPlayedForPhase !== s.phaseEndsAt) {
      threeMinWarningPlayedForPhase = s.phaseEndsAt;
      soundFX.playChime();
    }

    if (isAudioOutputActive() && diffSec === 60 && warningPlayedForPhase !== s.phaseEndsAt) {
      warningPlayedForPhase = s.phaseEndsAt;
      soundFX.playChime();
      soundFX.speakBulletin("One minute remaining in the current phase.");
    }
  }
}, 1000);

function getAssignedSuspectCharacters(s, pack) {
  const assignedIds = new Set(
    Object.values(s.players || {})
      .map(p => p.characterId)
      .filter(Boolean)
  );
  const activeSuspects = pack.characters.filter(c => c.role !== "victim" && assignedIds.has(c.id));
  return activeSuspects.length > 0 ? activeSuspects : pack.characters.slice(1, 7);
}

function resetToHome() {
  isExplicitExit = true;
  soundFX.stopAll();
  const currentCode = appState.roomCode;
  const currentPid = appState.playerId;
  const s = appState.sessionData;
  const isLobby = s && s.round === 0;
  const wasPlayer = appState.viewMode === "player";

  // 1. Detach listener and clear local state immediately so no incoming Firebase updates trigger alerts
  if (roomRef) {
    roomRef.off();
    roomRef = null;
  }
  if (secretHostRef) {
    secretHostRef.off();
    secretHostRef = null;
  }
  appState.viewMode = "home";
  appState.roomCode = "";
  appState.sessionData = null;
  appState.qrScannedRoom = false;
  try {
    localStorage.removeItem("mm_active_room");
    localStorage.removeItem("mm_active_mode");
  } catch (e) {}

  try {
    const url = new URL(window.location.href);
    url.searchParams.delete("room");
    url.searchParams.delete("tv");
    window.history.replaceState({}, "", url.toString());
  } catch (e) {}

  // 2. Remove player from lobby in Firebase
  if (wasPlayer && currentCode && currentPid && isLobby) {
    removePlayerFromLobby(currentCode, currentPid, s);
  }

  document.getElementById("timerBadge").classList.add("hidden");
  updateModeBadge();
  renderApp();
  syncPlayerIdToAuthUid(true);

  isExplicitExit = false;
}

function renderApp() {
  applyTvCompactClasses();
  updateModeBadge();
  const root = document.getElementById("appRoot");
  if (!root) return;

  const hostBtn = document.getElementById("claimHostTopBtn");
  if (hostBtn && appState.viewMode === "player") {
    const amIHost = isAuthorizedHostOrTV(appState.sessionData);
    hostBtn.textContent = amIHost ? "👑 Host ✓" : "👑 Claim Host";
    hostBtn.className = amIHost
      ? "text-[11px] sm:text-xs bg-emerald-950/90 text-emerald-300 px-2 sm:px-2.5 py-1 rounded border border-emerald-700 font-bold transition"
      : "text-[11px] sm:text-xs bg-amber-950/80 hover:bg-amber-900 text-amber-300 px-2 sm:px-2.5 py-1 rounded border border-amber-700/70 transition";
  }

  const winScrollY = window.scrollY;
  const activeEl = document.activeElement;
  const activeId = (activeEl && activeEl.id && activeEl !== document.body) ? activeEl.id : null;
  const activeVal = (activeId && "value" in activeEl) ? activeEl.value : null;
  let selStart = null, selEnd = null;
  if (activeId && activeEl.setSelectionRange) {
    try { selStart = activeEl.selectionStart; selEnd = activeEl.selectionEnd; } catch (e) {}
  }

  const scrollSnapshots = {};
  root.querySelectorAll("[data-scroll-id]").forEach(el => {
    scrollSnapshots[el.getAttribute("data-scroll-id")] = el.scrollTop;
  });

  if (appState.viewMode === "home") {
    root.innerHTML = renderHomeLauncher();
  } else if (appState.viewMode === "tv") {
    root.innerHTML = renderTVDashboard();
    renderTVQRCode();
  } else if (appState.viewMode === "player") {
    root.innerHTML = renderMobilePlayerView();
  }

  root.querySelectorAll("[data-scroll-id]").forEach(el => {
    const sid = el.getAttribute("data-scroll-id");
    if (scrollSnapshots[sid] !== undefined) {
      el.scrollTop = scrollSnapshots[sid];
    }
  });
  window.scrollTo(0, winScrollY);

  if (activeId) {
    const restoredEl = document.getElementById(activeId);
    if (restoredEl) {
      if (activeVal !== null && "value" in restoredEl) {
        restoredEl.value = activeVal;
      }
      restoredEl.focus();
      if (selStart !== null && restoredEl.setSelectionRange) {
        try { restoredEl.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}

function handleStartTVNew() {
  soundFX.unlock();
  const sel = document.getElementById("launchMysterySelect").value;
  createNewRoom(sel, "tv");
}

function handleStartPhoneHostNew() {
  const sel = document.getElementById("launchMysterySelect").value;
  const name = prompt("Enter your player name (You can host & play spoiler-free!):", appState.playerName || "Host");
  if (!name) return;
  appState.playerName = name.trim();
  localStorage.setItem("mm_player_name", appState.playerName);
  createNewRoom(sel, "player");
}

function handleJoinPhone() {
  const code = document.getElementById("joinRoomCodeInput").value;
  const name = document.getElementById("joinPlayerNameInput").value;
  joinExistingRoom(code, name, "player");
}

function handleJoinTVExisting() {
  soundFX.unlock();
  const code = document.getElementById("joinRoomCodeInput").value;
  joinExistingRoom(code, "", "tv");
}

function renderTVQRCode() {
  const containers = document.querySelectorAll("#tvQrContainer, .tvQrTarget");
  if (!containers.length || !window.QRCode || !appState.sessionData) return;
  const code = appState.sessionData.roomCode;
  const qrSize = 280;

  if (lastRenderedQRRoom === code && cachedQRDataUrl) {
    containers.forEach(c => {
      c.innerHTML = `<img src="${cachedQRDataUrl}" alt="Join QR" class="w-full h-full object-contain block mx-auto" />`;
    });
    return;
  }

  const firstContainer = containers[0];
  firstContainer.innerHTML = "";
  const url = new URL(window.location.href);
  url.searchParams.delete("tv");
  url.searchParams.set("room", code);
  new QRCode(firstContainer, {
    text: url.toString(),
    width: qrSize,
    height: qrSize,
    colorDark: "#090a0f",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.L
  });

  setTimeout(() => {
    const canvas = firstContainer.querySelector("canvas");
    const fallbackImg = firstContainer.querySelector("img");
    let dataUrl = null;
    if (canvas) {
      try { dataUrl = canvas.toDataURL(); } catch (e) {}
    }
    if (!dataUrl && fallbackImg && fallbackImg.src) {
      dataUrl = fallbackImg.src;
    }
    if (dataUrl) {
      cachedQRDataUrl = dataUrl;
      lastRenderedQRRoom = code;
      containers.forEach(c => {
        c.innerHTML = `<img src="${cachedQRDataUrl}" alt="Join QR" width="${qrSize}" height="${qrSize}" />`;
      });
    }
  }, 60);
}

function renderGuideStep(stepIndex) {
  if (stepIndex < 0) stepIndex = 0;
  if (stepIndex >= guideSteps.length) stepIndex = guideSteps.length - 1;
  currentGuideStep = stepIndex;

  const step = guideSteps[currentGuideStep];

  const titleEl = document.getElementById("guideTitle");
  const descEl = document.getElementById("guideDescription");
  const frameEl = document.getElementById("guideScreenshotFrame");
  if (titleEl) titleEl.innerText = step.title;
  if (descEl) descEl.innerText = step.desc;
  if (frameEl) frameEl.innerHTML = step.mockup;

  const bulletsContainer = document.getElementById("guideBulletPoints");
  if (bulletsContainer) {
    if (step.bullets && step.bullets.length > 0) {
      bulletsContainer.classList.remove("hidden");
      bulletsContainer.innerHTML = step.bullets.map(b => `
        <div class="flex items-start gap-2">
          <span class="text-amber-400 text-xs mt-0.5">•</span>
          <p class="text-slate-300 leading-relaxed text-xs">${b}</p>
        </div>
      `).join("");
    } else {
      bulletsContainer.classList.add("hidden");
      bulletsContainer.innerHTML = "";
    }
  }

  const dotsContainer = document.getElementById("guideStepDots");
  if (dotsContainer) {
    dotsContainer.innerHTML = guideSteps.map((_, i) => `
      <button onclick="renderGuideStep(${i})" title="Go to step ${i + 1}" class="h-1.5 rounded-full transition-all ${
        i === currentGuideStep
          ? "w-6 bg-amber-400 shadow-sm shadow-amber-400/50"
          : "w-2 bg-slate-700 hover:bg-slate-600"
      }"></button>
    `).join("");
  }

  const prevBtn = document.getElementById("guidePrevBtn");
  const nextBtn = document.getElementById("guideNextBtn");
  if (prevBtn) prevBtn.disabled = (currentGuideStep === 0);

  if (nextBtn) {
    if (currentGuideStep === guideSteps.length - 1) {
      nextBtn.innerHTML = `<span>Done</span> <span class="text-slate-950 font-black">✓</span>`;
      nextBtn.className = "px-5 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl text-xs transition shadow-md active:scale-95 flex items-center gap-1";
    } else {
      nextBtn.innerHTML = `<span>Next</span> <span>→</span>`;
      nextBtn.className = "px-5 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs transition shadow-md active:scale-95 flex items-center gap-1";
    }
  }
}

function prevGuideStep() {
  if (currentGuideStep > 0) {
    renderGuideStep(currentGuideStep - 1);
  }
}

function nextGuideStep() {
  if (currentGuideStep < guideSteps.length - 1) {
    renderGuideStep(currentGuideStep + 1);
  } else {
    closeAppOverviewModal();
  }
}

function openAppOverviewModal() {
  const modal = document.getElementById("appOverviewModal");
  if (modal) {
    modal.classList.remove("hidden");
    renderGuideStep(0);
  }
}

function closeAppOverviewModal() {
  const modal = document.getElementById("appOverviewModal");
  if (modal) modal.classList.add("hidden");
}

function handleAppRootDelegatedClick(ev) {
  const target = ev && ev.target && typeof ev.target.closest === "function" ? ev.target.closest("[data-action]") : null;
  if (!target) return;
  const action = target.getAttribute("data-action");
  if (action === "view-mugshot") {
    const pid = target.getAttribute("data-pid");
    const pname = target.getAttribute("data-pname") || "Suspect";
    handleMugshotClick(pid, pname);
  } else if (action === "kick-player") {
    const pid = target.getAttribute("data-pid");
    kickPlayerFromLobby(pid);
  } else if (action === "cast-killer-vote") {
    const charId = target.getAttribute("data-char-id");
    if (charId) submitPlayerVote(appState.playerId, charId);
  } else if (action === "cast-award-vote") {
    const category = target.getAttribute("data-category");
    const targetPid = target.getAttribute("data-target-pid");
    if (category && targetPid) submitAwardVote(appState.playerId, category, targetPid);
  } else if (action === "replay-mystery") {
    const mid = target.getAttribute("data-mystery-id");
    resetRoomForNextGame(mid);
  }
}

/* ============================================================================
   9. URL PARAMETER BOOTSTRAP
   ============================================================================ */
window.addEventListener("DOMContentLoaded", () => {
  localStorage.removeItem("mm_force_local");
  const appRootEl = document.getElementById("appRoot");
  if (appRootEl && !appRootDelegatedBound && typeof appRootEl.addEventListener === "function") {
    appRootEl.addEventListener("click", handleAppRootDelegatedClick);
    appRootDelegatedBound = true;
  }
  initSyncBackend();
  const params = new URLSearchParams(window.location.search);
  const roomFromQR = params.get("room");
  const isTvReconnect = params.get("tv") === "1";
  const savedActiveRoom = localStorage.getItem("mm_active_room");
  const savedActiveMode = localStorage.getItem("mm_active_mode");

  if (roomFromQR && isTvReconnect) {
    joinExistingRoom(roomFromQR.toUpperCase(), "", "tv");
    return;
  }
  // If user refreshed their phone browser while active in a room, resume active session directly
  if (roomFromQR && savedActiveRoom && roomFromQR.toUpperCase() === savedActiveRoom.toUpperCase()) {
    if (savedActiveMode === "player" && appState.playerName) {
      joinExistingRoom(roomFromQR.toUpperCase(), appState.playerName, "player");
      return;
    } else if (savedActiveMode === "tv") {
      joinExistingRoom(roomFromQR.toUpperCase(), "", "tv");
      return;
    }
  }
  if (roomFromQR) {
    appState.roomCode = roomFromQR.toUpperCase();
    appState.qrScannedRoom = true;
  }
  renderApp();
  if (appState.qrScannedRoom) {
    const nameInput = document.getElementById("joinPlayerNameInput");
    if (nameInput) nameInput.focus();
  }
});
</script>
